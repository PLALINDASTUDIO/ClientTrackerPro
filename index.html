/* ============ BACKUP ============ */
function csvEscape(v){
  v = v==null?'':String(v);
  if(/[",\n]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"';
  return v;
}
function toCSV(headers,rows){
  const lines=[headers.map(csvEscape).join(',')];
  rows.forEach(function(r){ lines.push(r.map(csvEscape).join(',')); });
  return lines.join('\r\n');
}
function downloadCSV(filename,csv){
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}
function exportClientsCSV(){
  if(!state.clients.length){ toast('No clients to export'); return; }
  const headers=['Name','Company','Email','Phone','Address','Stage','Priority','Type','Tags','Follow-up Status','Next Follow-up','Date Added','Notes'];
  const rows=state.clients.map(function(c){
    return [c.name,c.company||'',c.email||'',c.phone||'',c.address||'',c.stage||'',c.priority||'',c.clientType||'',(c.tags||[]).join('; '),c.followUpStatus||'',c.nextFollowUp||'',c.createdAt||'',c.notes||''];
  });
  downloadCSV('clients.csv',toCSV(headers,rows));
  toast('Clients exported');
}
function exportProjectsCSV(){
  if(!state.projects.length){ toast('No projects to export'); return; }
  const headers=['Title','Client','Status','Start Date','Due Date','Value','Amount Paid','Remaining Balance','Notes'];
  const rows=state.projects.map(function(p){
    const c=clientById(p.clientId); const val=Number(p.value||0), paid=Number(p.amountPaid||0);
    return [p.title,c?c.name:'',p.status||'',p.startDate||'',p.dueDate||'',val.toFixed(2),paid.toFixed(2),(val-paid).toFixed(2),p.notes||''];
  });
  downloadCSV('projects.csv',toCSV(headers,rows));
  toast('Projects exported');
}
function exportInvoicesCSV(){
  if(!state.invoices.length){ toast('No invoices to export'); return; }
  const headers=['Invoice Number','Client','Amount','Amount Paid','Remaining','Status','Issue Date','Due Date'];
  const rows=state.invoices.map(function(i){
    const c=clientById(i.clientId); const amt=Number(i.amount||0), paid=Number(i.amountPaid||0);
    return [i.invoiceNumber||'',c?c.name:'',amt.toFixed(2),paid.toFixed(2),(amt-paid).toFixed(2),invoiceStatusOf(i),i.issueDate||'',i.dueDate||''];
  });
  downloadCSV('invoices.csv',toCSV(headers,rows));
  toast('Invoices exported');
}
function exportPaymentsCSV(){
  if(!state.invoices.length){ toast('No payments to export'); return; }
  const headers=['Client','Invoice Number','Total Amount','Amount Paid','Remaining Balance','Payment Status','Due Date'];
  const rows=state.invoices.map(function(i){
    const c=clientById(i.clientId); const amt=Number(i.amount||0), paid=Number(i.amountPaid||0);
    return [c?c.name:'',i.invoiceNumber||'',amt.toFixed(2),paid.toFixed(2),(amt-paid).toFixed(2),invoiceStatusOf(i),i.dueDate||''];
  });
  downloadCSV('payments.csv',toCSV(headers,rows));
  toast('Payments exported');
}
function viewBackup(){
  return '<div class="panel"><div class="panel-title"><h2>Export your data</h2></div>'+
    '<p style="color:var(--muted);font-size:13px;margin-bottom:14px">Download a full backup file of all your clients, projects, invoices, and contact history.</p>'+
    '<button class="btn btn-primary" onclick="exportBackup()">'+iconSvg('i-download')+'Download backup (.json)</button>'+
    '<div class="panel-title" style="margin-top:24px"><h2>Import a backup</h2></div>'+
    '<input type="file" id="importFile" accept="application/json" onchange="importBackup(this.files[0])"/>'+
  '</div>'+
  '<div class="panel"><div class="panel-title"><h2>Export to CSV</h2></div>'+
    '<p style="color:var(--muted);font-size:13px;margin-bottom:14px">Download individual spreadsheets you can open in Excel, Google Sheets, or Numbers.</p>'+
    '<div class="csv-export-grid">'+
      '<button class="btn btn-outline" onclick="exportClientsCSV()">'+iconSvg('i-users')+'Clients</button>'+
      '<button class="btn btn-outline" onclick="exportProjectsCSV()">'+iconSvg('i-briefcase')+'Projects</button>'+
      '<button class="btn btn-outline" onclick="exportInvoicesCSV()">'+iconSvg('i-invoice')+'Invoices</button>'+
      '<button class="btn btn-outline" onclick="exportPaymentsCSV()">'+iconSvg('i-chart')+'Payments</button>'+
    '</div>'+
  '</div>';

function exportBackup(){
  state.settings.lastBackupDate=todayISO(); saveState();
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='client-tracker-backup.json'; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  toast('Backup downloaded');
}
function importBackup(file){
  if(!file) return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{ const data=JSON.parse(e.target.result); if(!data.clients){ throw new Error('invalid'); } state=data; saveState(); applyAccentTheme(); applyFontChoice(); renderDemoBadge(); toast('Backup restored'); navigate('dashboard'); }
    catch(err){ toast('Could not read that file'); }
  };
  reader.readAsText(file);
}

function ciqShuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function ciqNumWrongs(correct){
  const set=new Set(); const deltas=ciqShuffle([1,-1,2,-2,3,-3]);
  deltas.forEach(function(d){ const v=correct+d; if(v>=0 && v!==correct) set.add(String(v)); });
  return Array.from(set);
}
function allClientNames(excludeId){ return state.clients.filter(function(c){return c.id!==excludeId;}).map(function(c){return c.name;}); }
function ciqBuildQ(text, correctLabel, wrongPool, category){
  const wrongs = ciqShuffle(Array.from(new Set(wrongPool.filter(function(w){return w && w!==correctLabel;})))).slice(0,3);
  if(wrongs.length<1) return null;
  const options = ciqShuffle([correctLabel].concat(wrongs));
  return {text:text, options:options, correctIndex:options.indexOf(correctLabel), personalized:true, badge:'✨ Based on Your Data', category:category||'Your Data', explanation:null};
}

function ciqGen_mostRecentClient(){
  if(state.clients.length<2) return null;
  const sorted=state.clients.slice().sort(function(a,b){return (b.createdAt||'').localeCompare(a.createdAt||'');});
  return ciqBuildQ('Which client was added most recently?', sorted[0].name, sorted.slice(1).map(function(c){return c.name;}), 'Clients');
}
function ciqGen_activeClientsCount(){
  if(!state.clients.length) return null;
  const n=state.clients.filter(function(c){return c.stage==='active';}).length;
  return ciqBuildQ('How many Active clients do you currently have?', String(n), ciqNumWrongs(n), 'Clients');
}
function ciqGen_vipClientsCount(){

  return ciqBuildQ('How many VIP clients do you have?', String(n), ciqNumWrongs(n), 'Clients');

function ciqGen_highestPriorityClient(){

function ciqGen_mostProjectsClient(){
  if(state.clients.length<2||!state.projects.length) return null;
  const counts={}; state.projects.forEach(function(p){ counts[p.clientId]=(counts[p.clientId]||0)+1; });
  let bestId=null,bestN=0,tie=false;
  Object.keys(counts).forEach(function(id){ if(counts[id]>bestN){bestN=counts[id];bestId=id;tie=false;} else if(counts[id]===bestN){tie=true;} });
  if(!bestId||bestN===0||tie) return null;
  const c=clientById(bestId); if(!c) return null;
  return ciqBuildQ('Which client has the most projects?', c.name, allClientNames(c.id), 'Clients');
}
function ciqGen_nextFollowUpClient(){
  const withFU=state.clients.filter(function(c){return c.nextFollowUp;});
  if(withFU.length<2) return null;
  const sorted=withFU.slice().sort(function(a,b){return a.nextFollowUp.localeCompare(b.nextFollowUp);});
  if(sorted[0].nextFollowUp===sorted[1].nextFollowUp) return null;
  return ciqBuildQ('Which client needs a follow-up next?', sorted[0].name, sorted.slice(1).map(function(c){return c.name;}), 'Follow-ups');

  return ciqBuildQ('Which contact method do you use most often?', label(types[0]), types.slice(1).map(label), 'Communication');

const PERSONALIZED_GENERATORS=[ciqGen_mostRecentClient,ciqGen_activeClientsCount,ciqGen_vipClientsCount,ciqGen_highestPriorityClient,ciqGen_mostProjectsClient,ciqGen_nextFollowUpClient,ciqGen_dueTodayCount,ciqGen_overdueCount,ciqGen_mostOverdueClient,ciqGen_mostRecentlyContactedClient,ciqGen_longestNoContactClient,ciqGen_nearestDeadlineClient,ciqGen_activeProjectsCount,ciqGen_mostActiveProjectsClient,ciqGen_nearestDueProject,ciqGen_overdueProjectsCount,ciqGen_highestOutstandingClient,ciqGen_totalOutstandingAmount,ciqGen_mostPaidClient,ciqGen_overdueInvoicesCount,ciqGen_highestUnpaidInvoiceClient,ciqGen_largestTotalValueClient,ciqGen_unpaidInvoicesCount,ciqGen_mostInvoicesClient,ciqGen_mostCommRecordsClient,ciqGen_recentInteractionsCount,ciqGen_mostUsedCommMethod];

const CIQ_SCENARIOS=[
 {category:'Client Communication',text:"A client hasn't responded for several days. What is usually the best next step?",options:["Message them repeatedly","Send a polite professional follow-up","Immediately delete the client","Cancel the project"],correctIndex:1,explanation:"A single polite follow-up keeps the door open without seeming pushy."},
 {category:'Client Communication',text:"What's the best way to confirm a client understood an important instruction?",options:["Assume they understood","Ask them to repeat it back or summarize","Repeat it once and move on","Send it only once in writing"],correctIndex:1,explanation:"Having them restate it in their own words catches misunderstandings early."},
 {category:'Follow-Ups',text:"How often should you generally follow up with a lead who hasn't responded?",options:["Every few hours","Every few days, with spacing between attempts","Once, then never again","Only when they contact you first"],correctIndex:1,explanation:"Spaced-out follow-ups stay persistent without becoming annoying."},
 {category:'Follow-Ups',text:"What's a good habit for staying on top of follow-ups?",options:["Rely on memory alone","Set a specific next-follow-up date after every contact","Follow up only when convenient","Wait for the client to reach out"],correctIndex:1,explanation:"A concrete next date turns 'I should follow up' into an actual scheduled task."},
 {category:'Late Payments',text:"An invoice is now 10 days overdue. What's the best first move?",options:["Send a firm, friendly payment reminder","Immediately stop all work and threaten legal action","Ignore it and hope they pay eventually","Post about it publicly online"],correctIndex:0,explanation:"Most late payments are oversights — a friendly reminder resolves them quickly and preserves the relationship."},
 {category:'Late Payments',text:"What can help reduce late payments in the future?",options:["Never discuss payment terms upfront","Clear payment terms and due dates stated in advance","Accepting payment 'whenever'","Avoiding invoices altogether"],correctIndex:1,explanation:"Clarity upfront sets expectations and reduces confusion or delay later."},
 {category:'Difficult Clients',text:"A client is being unreasonably demanding. What's usually the most professional response?",options:["Match their tone and argue back","Stay calm, restate boundaries clearly, and keep it professional","Ignore all their messages","Immediately end the relationship"],correctIndex:1,explanation:"Calm, clear boundaries de-escalate tension while keeping the relationship workable."},
 {category:'Difficult Clients',text:"What's a healthy way to handle scope creep from a client?",options:["Silently absorb the extra work every time","Discuss it openly and adjust the agreement or price","Do the work but complain about it later","Refuse to speak with the client again"],correctIndex:1,explanation:"An open conversation keeps expectations fair for both sides."},
 {category:'Client Retention',text:"What tends to keep clients coming back long-term?",options:["Being unreachable between projects","Consistent communication and reliable delivery","Constantly changing your prices","Avoiding any personal rapport"],correctIndex:1,explanation:"Reliability and communication build the trust that drives repeat business."},
 {category:'Client Retention',text:"When is a good time to check in with a past client?",options:["Never — only wait for them to reach out","Periodically, especially after a project wraps up","Only when you need more work","Right before a big holiday sale"],correctIndex:1,explanation:"A thoughtful check-in after a project shows you value the relationship, not just the transaction."},
 {category:'Project Management',text:"What's a good practice when a project deadline looks at risk?",options:["Say nothing until it's late","Communicate early and propose a revised plan","Quietly extend the deadline without telling the client","Blame the client for the delay"],correctIndex:1,explanation:"Early, honest communication gives everyone time to adjust and keeps trust intact."},
 {category:'Project Management',text:"Why is breaking a project into smaller milestones useful?",options:["It makes invoicing more complicated","It's easier to track progress and catch issues early","Clients dislike seeing progress","It has no real benefit"],correctIndex:1,explanation:"Milestones make progress visible and let problems surface before they become bigger."},
 {category:'Time Management',text:"What's an effective way to manage multiple client deadlines at once?",options:["Keep it all in your head","Track deadlines somewhere visible and review regularly","Handle whichever client emails last","Ignore less-urgent deadlines until they're overdue"],correctIndex:1,explanation:"A visible, regularly reviewed system prevents anything from quietly slipping through the cracks."},
 {category:'Time Management',text:"What's a common cause of missed follow-ups for small business owners?",options:["Too much organization","Relying on memory instead of a tracking system","Following up too early","Having too few clients"],correctIndex:1,explanation:"Memory alone doesn't scale — a tracking habit is what actually prevents things slipping through."},
 {category:'Invoices',text:"What should a professional invoice clearly include?",options:["Just a total dollar amount","Itemized work, amount, due date, and payment details","A vague description only","Nothing but your business name"],correctIndex:1,explanation:"Clear, itemized invoices reduce confusion and payment delays."},
 {category:'Invoices',text:"When is the best time to send an invoice?",options:["Months after the work is done","Promptly after the work or milestone is complete","Only if the client asks for one","Whenever you remember"],correctIndex:1,explanation:"Prompt invoicing while the work is fresh leads to faster, smoother payment."},
 {category:'Professional Boundaries',text:"A client keeps messaging late at night expecting instant replies. What's a healthy response?",options:["Always reply instantly, any time of day","Set and communicate clear working hours","Never respond to that client again","Complain about it publicly"],correctIndex:1,explanation:"Clear working hours protect your time while still being professional and responsive."},
 {category:'Professional Boundaries',text:"Why is it useful to have a written agreement or scope for every project?",options:["It's unnecessary paperwork","It protects both sides by clarifying expectations","It slows down the relationship","It's only needed for large projects"],correctIndex:1,explanation:"A written scope prevents misunderstandings about what's included — for you and the client."},
 {category:'Client Organization',text:"Why is it helpful to tag or categorize clients (e.g. VIP, Referral)?",options:["It has no practical use","It helps you prioritize attention and spot patterns","It's only for large companies","It complicates a simple client list"],correctIndex:1,explanation:"Tags make it easy to filter and prioritize who needs attention first."},
 {category:'Client Organization',text:"What's a benefit of keeping notes on every client interaction?",options:["It wastes time","You can pick up right where you left off, even months later","Clients dislike being remembered","It's unnecessary if you have a good memory"],correctIndex:1,explanation:"Good notes mean nothing gets lost between conversations, even long gaps."}
];

let ciqGame=null;
function ciqBuildQuestionSet(){
  const generated=[];
  ciqShuffle(PERSONALIZED_GENERATORS).forEach(function(fn){ try{ const q=fn(); if(q) generated.push(q); }catch(e){} });
  const seen=new Set();
  const uniqueGenerated=generated.filter(function(q){ if(seen.has(q.text)) return false; seen.add(q.text); return true; });
  const targetPersonalized=Math.min(6,uniqueGenerated.length);
  const personalizedPicked=uniqueGenerated.slice(0,targetPersonalized);
  const remaining=10-personalizedPicked.length;
  const scenarioPool=ciqShuffle(CIQ_SCENARIOS.slice());
  function toRuntimeScenario(s){
    const correctVal=s.options[s.correctIndex];
    const opts=ciqShuffle(s.options.slice());
    return {text:s.text,options:opts,correctIndex:opts.indexOf(correctVal),personalized:false,badge:'🧠 Client Management',category:s.category,explanation:s.explanation};
  }
  const scenarioPicked=scenarioPool.slice(0,remaining).map(toRuntimeScenario);
  let all=personalizedPicked.concat(scenarioPicked);
  if(all.length<10){
    const extra=scenarioPool.slice(remaining,remaining+(10-all.length)).map(toRuntimeScenario);
    all=all.concat(extra);
  }
  return ciqShuffle(all).slice(0,Math.min(10,all.length));
}
function ciqStart(){
  const qs=ciqBuildQuestionSet();
  ciqGame={questions:qs,index:0,score:0,correctCount:0,personalizedCorrect:0,personalizedTotal:qs.filter(function(q){return q.personalized;}).length,scenarioCorrect:0,scenarioTotal:qs.filter(function(q){return !q.personalized;}).length,answered:false,selected:-1,finished:false};
  navigate('clientiq');
}
function ciqAnswer(idx){
  if(!ciqGame||ciqGame.answered) return;
  ciqGame.answered=true; ciqGame.selected=idx;
  const q=ciqGame.questions[ciqGame.index];
  if(idx===q.correctIndex){ ciqGame.score+=100; ciqGame.correctCount++; if(q.personalized) ciqGame.personalizedCorrect++; else ciqGame.scenarioCorrect++; }
  render('clientiq');
}
function ciqNext(){
  if(!ciqGame) return;
  ciqGame.index++; ciqGame.answered=false; ciqGame.selected=-1;
  if(ciqGame.index>=ciqGame.questions.length){ ciqFinish(); return; }
  render('clientiq');
}
function ciqLevel(correct){
  if(correct<=3) return {icon:'🌱',label:'Client Rookie'};
  if(correct<=6) return {icon:'📋',label:'Client Organizer'};
  if(correct<=8) return {icon:'⭐',label:'Client Pro'};
  if(correct===9) return {icon:'🧠',label:'Client Expert'};
  return {icon:'🏆',label:'Client Master'};
}
function ciqFinish(){
  const lvl=ciqLevel(ciqGame.correctCount);
  const iq=state.settings.clientIQ||{bestScore:0,bestCorrect:0,bestLevel:''};
  if(ciqGame.score>iq.bestScore){ iq.bestScore=ciqGame.score; iq.bestCorrect=ciqGame.correctCount; iq.bestLevel=lvl.label; state.settings.clientIQ=iq; saveState(); }
  ciqGame.finished=true;
  render('clientiq');
}
function ciqPlayAgain(){ ciqStart(); }
function ciqBackToDashboard(){ ciqGame=null; navigate('dashboard'); }
function ciqHasEnoughData(){
  for(let i=0;i<PERSONALIZED_GENERATORS.length;i++){ try{ if(PERSONALIZED_GENERATORS[i]()) return true; }catch(e){} }
  return false;
}
function viewClientIQ(){
  if(!ciqGame) return ciqStartScreen();
  if(ciqGame.finished) return ciqResultsScreen();
  return ciqQuestionScreen();
}
function ciqStartScreen(){
  const iq=state.settings.clientIQ||{bestScore:0,bestCorrect:0,bestLevel:''};
  const hasData=ciqHasEnoughData();
  return '<div class="panel ciq-start">'+
    '<div class="ciq-hero-icon">'+iconSvg('i-brain')+'</div>'+
    '<h2>Client IQ Challenge</h2>'+
    '<p class="ciq-sub">How well do you really know your clients?</p>'+
    '<p class="ciq-desc">Test your knowledge using your own Client Tracker data and real-world client management scenarios.</p>'+
    '<div class="ciq-meta-row"><span>10 Questions</span><span>·</span><span>Personalized + Scenario</span></div>'+
    (iq.bestScore>0?'<div class="ciq-best">Best Score: '+iq.bestScore+' / 1000'+(iq.bestLevel?' · '+esc(iq.bestLevel):'')+'</div>':'')+
    (hasData?
      '<button class="btn btn-primary ciq-start-btn" onclick="ciqStart()">'+iconSvg('i-check')+'Start Challenge</button>'
    :
      '<p class="ciq-empty-note">Your personalized challenges will unlock as you add clients and activity.</p>'+
      '<button class="btn btn-primary ciq-start-btn" onclick="ciqStart()">'+iconSvg('i-check')+'Play Practice Challenge</button>'
    )+
  '</div>';
}
function ciqQuestionScreen(){
  const q=ciqGame.questions[ciqGame.index];
  const pct=Math.round((ciqGame.index/ciqGame.questions.length)*100);
  return '<div class="panel ciq-panel">'+
    '<div class="ciq-topbar-row"><span>Question '+(ciqGame.index+1)+' of '+ciqGame.questions.length+'</span><span>Score: '+ciqGame.score+'</span></div>'+
    '<div class="ciq-progress-bar"><div class="ciq-progress-fill" style="width:'+pct+'%"></div></div>'+
    '<div class="ciq-badge '+(q.personalized?'ciq-badge-personal':'ciq-badge-scenario')+'">'+q.badge+'</div>'+
    '<h3 class="ciq-question">'+esc(q.text)+'</h3>'+
    '<div class="ciq-options">'+q.options.map(function(opt,i){
      let cls='ciq-option';
      if(ciqGame.answered){
        if(i===q.correctIndex) cls+=' ciq-correct';
        else if(i===ciqGame.selected) cls+=' ciq-incorrect';
        else cls+=' ciq-disabled';
      }
      return '<button class="'+cls+'" '+(ciqGame.answered?'disabled':'')+' onclick="ciqAnswer('+i+')">'+esc(opt)+'</button>';
    }).join('')+'</div>'+
    (ciqGame.answered?
      '<div class="ciq-feedback '+(ciqGame.selected===q.correctIndex?'ciq-feedback-correct':'ciq-feedback-wrong')+'">'+
        '<b>'+(ciqGame.selected===q.correctIndex?'✓ Correct!':'✕ Not quite — the correct answer is '+esc(q.options[q.correctIndex]))+'</b>'+
        (q.explanation?'<p>'+esc(q.explanation)+'</p>':'')+
      '</div>'+
      '<button class="btn btn-primary ciq-next-btn" onclick="ciqNext()">'+(ciqGame.index+1>=ciqGame.questions.length?'See Results':'Next Question')+iconSvg('i-chevron-r')+'</button>'
    :'')+
  '</div>';
}
function ciqResultsScreen(){
  const lvl=ciqLevel(ciqGame.correctCount);
  const iq=state.settings.clientIQ||{bestScore:0,bestCorrect:0,bestLevel:''};
  return '<div class="panel ciq-results">'+
    '<h2>Challenge Complete!</h2>'+
    '<div class="ciq-result-level">'+lvl.icon+' '+lvl.label+'</div>'+
    '<div class="ciq-result-score">'+ciqGame.correctCount+' / '+ciqGame.questions.length+' Correct</div>'+
    '<div class="ciq-result-points">'+ciqGame.score+' Points</div>'+
    '<div class="ciq-result-breakdown">'+
      '<div><b>'+ciqGame.personalizedCorrect+'/'+ciqGame.personalizedTotal+'</b><span>Personalized</span></div>'+
      '<div><b>'+ciqGame.scenarioCorrect+'/'+ciqGame.scenarioTotal+'</b><span>Scenario</span></div>'+
      '<div><b>'+iq.bestScore+'</b><span>Best Score</span></div>'+
    '</div>'+
    '<div class="ciq-result-actions">'+
      '<button class="btn btn-primary" onclick="ciqPlayAgain()">'+iconSvg('i-check')+'Play Again</button>'+
      '<button class="btn btn-outline" onclick="ciqBackToDashboard()">Back to Dashboard</button>'+
    '</div>'+
  '</div>';
}
function renderClientIQCard(){
  const el=document.getElementById('clientiqCard'); if(!el) return;
  const iq=state.settings.clientIQ||{bestScore:0,bestCorrect:0,bestLevel:''};
  el.innerHTML='<div class="clientiq-icon">'+iconSvg('i-brain')+'</div><b>Client IQ</b><p>'+(iq.bestScore>0?'Best: '+iq.bestScore+(iq.bestLevel?' · '+esc(iq.bestLevel):''):'Test your client knowledge')+'</p>';
}
