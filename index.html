    radial-gradient(circle at 68% 0%,var(--blob1) 0,transparent 30%),
    radial-gradient(circle at 100% 15%,var(--blob3) 0,transparent 26%),
    var(--bg);
  transition:background-color .4s ease}
body.dark{--bg:#171418;--panel:#211c22ee;--panel-solid:#211c22;--text:#f7f2f0;--muted:#a89c9a;--border:#332b30;--navy-tint:#2e2229;--shadow:0 12px 35px rgba(0,0,0,.28)}
body.dark .nav button.active{color:var(--amber-2)}
body.dark .avatar{color:var(--amber-2)}
body.dark .panel-title h2{background:linear-gradient(120deg,var(--amber-2) 0%,var(--navy-2) 100%);-webkit-background-clip:text;background-clip:text}
body.dark .brand-text{color:var(--text)}
button,input,select,textarea{font:inherit;color:inherit}
.icon{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-duo{stroke:currentColor;fill:currentColor}
.icon-duo .duo-bg{fill-opacity:.16;stroke:none}
.icon-duo .duo-line{fill:none;stroke-width:1.9}

/* ===== Layout ===== */
.app{display:grid;grid-template-columns:230px 1fr;gap:16px;padding:16px;min-height:100vh}
.sidebar{background:var(--panel);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);padding:18px 12px;display:flex;flex-direction:column;position:sticky;top:16px;height:calc(100vh - 32px);backdrop-filter:blur(16px);z-index:70}
.brand{display:flex;flex-direction:column;gap:6px;padding:2px 4px 18px}
.brand-top{display:flex;align-items:center;gap:10px}
.brand-tagline{font-size:14.5px;font-weight:800;color:var(--navy);letter-spacing:.3px;padding-left:2px;line-height:1.1}
.brand-mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--navy),var(--amber));display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 8px 16px rgba(255,97,82,.3)}
.brand-mark .icon{width:19px;height:19px;stroke:#fff}
.brand-text{font-family:'Inter',sans-serif;font-weight:800;font-size:15px;letter-spacing:-.3px;display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap}
.brand-pro{font-size:9.5px;font-weight:800;background:linear-gradient(135deg,var(--navy),var(--amber));color:#fff;padding:3px 6px;border-radius:6px;letter-spacing:.6px;line-height:1;flex:none}
.brand-logo-img{height:32px;width:auto;max-width:100%;object-fit:contain;display:block}
.brand-logo-dark{display:none}
body.dark .brand-logo-light{display:none}
body.dark .brand-logo-dark{display:block;height:36px}

.nav{display:flex;flex-direction:column;gap:3px;flex:1;overflow-y:auto;overflow-x:hidden;padding-right:2px;min-height:0;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.nav::-webkit-scrollbar{width:4px}
.nav::-webkit-scrollbar-track{background:transparent}
.nav::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px}
.nav::-webkit-scrollbar-thumb:hover{background:var(--muted)}
.nav button{border:0;background:transparent;text-align:left;padding:10.5px 13px;border-radius:14px;display:flex;gap:11px;align-items:center;color:var(--muted);cursor:pointer;position:relative;transition:background .15s,color .15s;font-weight:600;font-size:13.5px;flex:none}
.nav button:hover{background:var(--navy-tint)}
.nav button.active{background:var(--navy-tint);color:var(--navy-dark);font-weight:700}
.nav button.active::before{content:"";position:absolute;left:-4px;top:9px;bottom:9px;width:3px;border-radius:4px;background:linear-gradient(180deg,var(--navy),var(--amber))}
.nav-section{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;padding:14px 13px 6px}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(30,15,15,.5);z-index:65;opacity:0;transition:opacity .25s;backdrop-filter:blur(2px)}
.sidebar-backdrop.show{display:block;opacity:1}

.clientiq-card{margin-top:10px;flex:none;background:linear-gradient(120deg,var(--navy) 0%,var(--amber) 100%);border-radius:16px;padding:13px;text-align:center;font-size:12px;cursor:pointer;transition:transform .15s;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.clientiq-card::after{content:"";position:absolute;top:-45%;right:-15%;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.08)}
.clientiq-card:hover{transform:translateY(-2px)}
.clientiq-icon{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;display:grid;place-items:center;margin:0 auto 7px;position:relative;z-index:1}
.clientiq-icon .icon{width:15px;height:15px}
.clientiq-card b,.clientiq-card p{position:relative;z-index:1}
.clientiq-card b{font-family:'Inter',sans-serif;font-size:12px;display:block;color:#fff}
.clientiq-card p{margin:5px 0 0;line-height:1.5;color:rgba(255,255,255,.85)}

.main{min-width:0}
.topbar{background:var(--panel);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow);padding:14px 18px;display:flex;align-items:center;gap:12px;backdrop-filter:blur(16px);position:relative;z-index:60;margin-bottom:16px;transition:background .2s}
.topbar > *{position:relative;z-index:2}
.topbar-accent{background:linear-gradient(120deg,var(--navy) 0%,var(--amber) 100%);border:none;backdrop-filter:none}
.topbar-bg-clip{position:absolute;inset:0;border-radius:22px;overflow:hidden;z-index:1;pointer-events:none}
.topbar-accent .topbar-bg-clip::after{content:"";position:absolute;top:-50%;right:-4%;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
.topbar-deco{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .2s;pointer-events:none}
.topbar-accent .topbar-deco{opacity:1}
.topbar-accent #pageTitle{color:#fff}
.topbar-accent .menu{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff}
.topbar-accent .btn-primary{box-shadow:0 6px 16px rgba(20,20,20,.22)}
.menu{width:42px;height:42px;border-radius:12px;border:1px solid var(--border);background:var(--panel-solid);cursor:pointer;display:grid;place-items:center;flex:none}
@media(min-width:851px){.menu{display:none}}
.hello{flex:1;min-width:270px}
.hello h1{font-family:'Inter',sans-serif;font-size:19px;font-weight:700;margin:0;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hello p{margin:3px 0 0;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.date-nav{display:flex;align-items:center;gap:5px;margin-top:4px;height:20px}
.date-nav button{width:19px;height:19px;border-radius:6px;border:1px solid var(--border);background:var(--panel-solid);display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none;padding:0;transition:background .15s,color .15s}
.date-nav button:hover{background:var(--navy-tint);color:var(--navy-dark)}
.date-nav button .icon{width:10px;height:10px}
.date-nav-label{font-size:12.5px;color:var(--muted);min-width:100px;transition:opacity .16s ease;white-space:nowrap}
.date-nav-label.fade{opacity:0}
.date-nav button.date-today-btn{font-size:10.5px;font-weight:700;color:var(--navy-dark);background:var(--navy-tint);padding:3px 9px;width:auto;height:auto;border-radius:999px;border:1px solid transparent;cursor:pointer;flex:none;transition:background .15s,transform .12s,box-shadow .15s,border-color .15s}
.date-nav button.date-today-btn:hover{background:var(--navy);color:#fff;box-shadow:0 4px 12px rgba(20,20,20,.15);transform:translateY(-1px)}
.date-nav button.date-today-btn:active{transform:translateY(0) scale(.96)}
body.dark .date-nav button.date-today-btn{color:var(--amber-2)}
body.dark .date-nav button.date-today-btn:hover{background:var(--navy-2);color:#fff}
.top-actions{display:flex;gap:9px;align-items:center;flex:none;position:relative}
.topright-icons{display:flex;gap:9px;align-items:center}
.global-search{flex:1;max-width:400px;position:relative;margin:0 16px}
.global-search .search-box{background:var(--bg);border-radius:12px}
.global-search-dropdown{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--panel);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:8px;max-height:360px;overflow-y:auto;z-index:80;opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none;transition:opacity .16s ease,transform .16s ease}
.global-search-dropdown.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.global-search-section{font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:8px 8px 4px}
@media(max-width:1000px){
  .topbar{flex-wrap:wrap}
  .hello{flex:1 1 100%}
  .global-search{order:2;flex:1;margin:0;min-width:0}
  .global-search-dropdown{left:0;right:auto;width:min(300px,86vw)}
  .top-actions{order:3}
  .top-actions.solo-right{width:100%;justify-content:flex-end}
}
.round-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--border);background:var(--panel-solid);cursor:pointer;display:grid;place-items:center;position:relative;transition:transform .15s,box-shadow .15s}
.round-btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(90,55,40,.1)}
.notif-badge{position:absolute;top:-4px;right:-4px;background:var(--rose);color:#fff;font-size:9.5px;font-weight:800;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 3px;border:2px solid var(--panel-solid)}
.theme-toggle{width:54px;height:30px;flex:none;padding:0;border-radius:20px;border:1px solid var(--border);background:linear-gradient(90deg,var(--amber-2),var(--navy-2));position:relative;cursor:pointer;box-shadow:inset 0 1px 2px rgba(255,255,255,.4)}
.theme-toggle-thumb{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .35s cubic-bezier(.34,1.35,.64,1);color:var(--amber)}
.theme-toggle-thumb .icon{width:13px;height:13px}
body.dark .theme-toggle-thumb{transform:translateX(24px);color:var(--navy-2)}

.notif-dropdown,.more-menu{position:absolute;top:calc(100% + 10px);right:0;width:300px;max-width:86vw;background:var(--panel);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:8px;max-height:360px;overflow-y:auto;z-index:80;opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none;transition:opacity .18s ease,transform .18s ease}
.notif-dropdown.show,.more-menu.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.notif-head-row{display:flex;align-items:center;justify-content:space-between;padding:6px 6px 4px 10px}
.notif-head{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.notif-clear-btn{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--muted);background:none;border:none;cursor:pointer;padding:4px 8px;border-radius:8px;transition:background .15s,color .15s}
.notif-clear-btn .icon{width:11px;height:11px}
.notif-clear-btn:hover{background:var(--navy-tint);color:var(--navy-dark)}
.notif-item{display:flex;gap:6px;align-items:center;padding:5px 6px 5px 10px;border-radius:11px}
.notif-item:hover{background:var(--navy-tint)}
.notif-item-body{display:flex;gap:10px;align-items:center;flex:1;min-width:0;cursor:pointer;padding:4px 0}
.notif-item-dismiss{width:24px;height:24px;border-radius:50%;border:none;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;flex:none;padding:0;transition:background .15s,color .15s}
.notif-item-dismiss:hover{background:var(--navy);color:#fff}
.notif-item-dismiss .icon{width:11px;height:11px}
.notif-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border-radius:12px;border:none;font-weight:700;font-size:13px;cursor:pointer;transition:transform .12s,box-shadow .15s}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;box-shadow:0 8px 18px rgba(255,97,82,.28)}
.btn-primary:hover{box-shadow:0 10px 22px rgba(255,97,82,.36)}
.btn-ghost{background:var(--navy-tint);color:var(--navy-dark)}
.btn-outline{background:var(--panel-solid);border:1px solid var(--border);color:var(--text)}
.btn-sm{padding:7px 12px;font-size:12px}

/* ===== Cards / stats ===== */
.cards{display:grid;grid-template-columns:repeat(4,minmax(170px,1fr));gap:14px;margin-bottom:16px}
.mini-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.mini-stat{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s}
.mini-stat:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(90,55,40,.14)}
.mini-stat .icon{width:16px;height:16px;color:var(--navy-dark);flex:none}
.mini-stat b{display:block;font-family:'Inter',sans-serif;font-size:15px;font-weight:800;line-height:1.2}
.mini-stat span{display:block;font-size:10.5px;color:var(--muted);font-weight:600;margin-top:1px}
@media(max-width:750px){.mini-stats{grid-template-columns:repeat(2,1fr)}}
.streak-banner{background:linear-gradient(120deg,#4b4f56 0%,#8b909a 45%,#aab0b8 55%,#4b4f56 100%);border-radius:20px;padding:18px 22px;display:flex;align-items:center;gap:16px;color:#fff;margin-bottom:16px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
.streak-banner:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(20,20,20,.24)}
.streak-banner::after{content:"";position:absolute;top:-40%;right:-6%;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
.streak-flame{width:50px;height:50px;border-radius:15px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none;position:relative;z-index:1}
.streak-flame .icon{width:26px;height:26px;stroke:#fff}
.streak-num{font-family:'Inter',sans-serif;font-size:26px;font-weight:800;line-height:1;position:relative;z-index:1}
.streak-label{font-size:12px;opacity:.88;font-weight:700;margin-top:3px;position:relative;z-index:1}
.streak-best{font-size:11px;opacity:.78;margin-top:5px;font-weight:600;position:relative;z-index:1}
.streak-msg{margin-left:auto;text-align:right;font-size:13px;font-weight:700;max-width:230px;position:relative;z-index:1;line-height:1.4}
@media(max-width:600px){.streak-banner{flex-wrap:wrap}.streak-msg{margin-left:0;text-align:left;max-width:none}}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.cards{grid-template-columns:1fr}}
@property --ring-angle{syntax:'<angle>';initial-value:0deg;inherits:false}
.stat-ring{position:relative;border-radius:20px;padding:3px;background:var(--card-color,var(--navy));box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s;--ring-angle:0deg;box-sizing:border-box}
.stat-ring:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(90,55,40,.14);background:conic-gradient(from var(--ring-angle),var(--navy),var(--amber),var(--sage),var(--rose),var(--navy));animation:ringAngleSpin 1.6s linear infinite}
@keyframes ringAngleSpin{from{--ring-angle:0deg}to{--ring-angle:360deg}}
.stat-card{position:relative;z-index:2;background:var(--panel-solid);border-radius:17px;padding:17px 19px;display:flex;gap:13px;align-items:flex-start;height:100%;box-sizing:border-box}
.stat-ring.clickable{cursor:pointer}
.stat-ring.clickable .stat-card{padding-right:38px}
.stat-go{position:absolute;top:50%;right:14px;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:var(--navy-tint);color:var(--muted);display:grid;place-items:center;opacity:0;transition:opacity .18s,transform .18s,background .18s,color .18s}
.stat-go .icon{width:13px;height:13px}
.stat-ring.clickable:hover .stat-go{opacity:1;transform:translateY(-50%) translateX(2px);background:var(--card-color,var(--navy));color:#fff}
.stat-icon{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none}
.stat-icon .icon{width:21px;height:21px}
.stat-value{font-family:'Inter',sans-serif;font-size:21px;font-weight:700;line-height:1.15}
.stat-label{font-size:11.5px;margin-top:5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.bg-navy{background:var(--navy-tint);color:var(--navy-dark)}
.bg-amber{background:#e2f7f6;color:var(--amber)}
.bg-sage{background:#e5f8ee;color:var(--sage)}
.bg-rose{background:#fceaeb;color:var(--rose)}
body.dark .bg-navy{background:#3a2820}
body.dark .bg-amber{background:#153331}
body.dark .bg-sage{background:#153726}
body.dark .bg-rose{background:#3a2226}

.panel{background:var(--panel);border:1px solid var(--border);box-shadow:var(--shadow);backdrop-filter:blur(14px);border-radius:20px;padding:19px;margin-bottom:16px;transition:box-shadow .2s}
.panel:hover{box-shadow:0 16px 40px rgba(90,55,40,.12)}
.panel-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.panel-title-left{display:flex;align-items:center;gap:9px;min-width:0}
.panel-title-ic{width:28px;height:28px;border-radius:9px;background:var(--navy-tint);color:var(--navy-dark);display:grid;place-items:center;flex:none}
.panel-title-ic .icon{width:14px;height:14px}
.panel-title h2{font-family:'Inter',sans-serif;font-size:16.5px;font-weight:800;margin:0;letter-spacing:-.2px;
  background:linear-gradient(120deg,var(--navy) 0%,var(--amber) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
.panel-title p{margin:2px 0 0;font-size:12px;color:var(--muted);font-weight:600}

.grid-2{display:grid;grid-template-columns:1.05fr .95fr;gap:14px}
.grid-2b{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:850px){.grid-2,.grid-2b{grid-template-columns:1fr}}

/* ===== Rows ===== */
.list-row{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--border);cursor:pointer;border-radius:12px;transition:background .15s}
.list-row:hover{background:var(--navy-tint)}
.list-row:last-child{border-bottom:none}
.avatar{width:38px;height:38px;border-radius:12px;background:var(--navy-tint);color:var(--navy-dark);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;box-shadow:0 0 0 2px var(--panel-solid),0 0 0 3.5px var(--ring-color,transparent)}
.row-main{flex:1;min-width:0}
.row-title{font-weight:700;font-size:13.5px}
.row-sub{font-size:12px;color:var(--muted)}
.row-end{text-align:right;flex:none;font-family:'Inter',sans-serif}

.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill-lead{background:#f1ece7;color:#8a7f78}
body.dark .pill-lead{background:#332b30;color:#a89c9a}
.pill-contacted{background:var(--navy-tint);color:var(--navy-dark)}
.pill-active{background:#e5f8ee;color:var(--sage)}
body.dark .pill-active{background:#153726;color:#5fdb9c}
.pill-done{background:#f1ece7;color:#8a7f78}
body.dark .pill-done{background:#332b30;color:#a89c9a}
.pill-paid{background:#e5f8ee;color:var(--sage)}
body.dark .pill-paid{background:#153726;color:#5fdb9c}
.pill-unpaid{background:#fceaeb;color:var(--rose)}
.pill-overdue{background:#fceaeb;color:var(--rose)}
.pill-partial{background:#fef3e2;color:#b8770e}
body.dark .pill-partial{background:#3a2f10;color:#f0b566}
body.dark .pill-unpaid,body.dark .pill-overdue{background:#3a2226;color:#ff8f92}

/* ===== Kanban ===== */
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:900px){.kanban{grid-template-columns:1fr}}
.kanban-col{background:var(--navy-tint);border-radius:18px;padding:12px}
.kanban-col-flash{animation:kanbanFlash 1.4s ease}
@keyframes kanbanFlash{0%{box-shadow:0 0 0 3px var(--navy)}60%{box-shadow:0 0 0 3px var(--navy)}100%{box-shadow:0 0 0 0px transparent}}
.kanban-col-head{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 10px;font-weight:800;font-size:13px;color:var(--navy-dark)}
.kanban-count{background:var(--panel-solid);border-radius:999px;padding:1px 9px;font-size:11px;color:var(--muted)}
.kanban-card{background:var(--panel-solid);border-radius:13px;padding:11px 13px;margin-bottom:8px;box-shadow:0 3px 10px rgba(90,55,40,.08);cursor:pointer;border:1px solid transparent;transition:transform .15s,box-shadow .15s}
.kanban-card:hover{border-color:var(--navy-2);transform:translateY(-2px);box-shadow:0 8px 18px rgba(90,55,40,.14)}
.kanban-card .kc-name{font-weight:700;font-size:13.5px;margin-bottom:2px}
.kanban-card .kc-meta{font-size:11.5px;color:var(--muted)}

/* ===== Donut & bar charts (signature) ===== */
.donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut-chart{width:150px;height:150px;position:relative;flex:none;filter:drop-shadow(0 8px 16px rgba(90,55,40,.14))}
.donut-chart svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:11px;color:var(--muted);font-weight:600}
.donut-center b{display:block;font-family:'Inter',sans-serif;font-size:20px;color:var(--text);font-weight:700}
.legend{flex:1;display:grid;gap:8px;font-size:12.5px;min-width:150px}
.legend-row{display:grid;grid-template-columns:10px 1fr auto auto;gap:9px;align-items:center;padding:6px 7px;border-radius:9px;cursor:pointer;transition:background .15s,transform .15s}
.legend-row:hover{background:var(--navy-tint);transform:translateX(2px)}
.legend-row i{width:9px;height:9px;border-radius:50%}
.legend-row .legend-go{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;color:var(--muted);opacity:0;transition:opacity .15s}
.legend-row .legend-go .icon{width:9px;height:9px}
.legend-row:hover .legend-go{opacity:1}
.bar-chart{position:relative;display:flex;align-items:flex-end;gap:14px;height:170px;padding:28px 6px 10px;border-bottom:1.5px solid var(--border)}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end;position:relative}
.bar-value{font-size:11px;font-weight:800;color:var(--text);opacity:0;transform:translateY(4px);transition:opacity .3s .3s,transform .3s .3s}
.bar-col:hover .bar-value,.bar-col.bar-in .bar-value{opacity:1;transform:translateY(0)}
.bar-fill-wrap{width:100%;max-width:38px;display:flex;align-items:flex-end;height:100%;border-radius:10px 10px 4px 4px;overflow:hidden;background:var(--navy-tint)}
.bar-fill{width:100%;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,var(--amber) 0%,var(--navy) 100%);min-height:6px;height:0;transition:height 1s cubic-bezier(.16,1,.3,1);box-shadow:inset 0 1px 3px rgba(255,255,255,.25),0 -2px 8px rgba(0,0,0,.08);position:relative}
.bar-col:hover .bar-fill{filter:brightness(1.08)}
.bar-label{font-size:10.5px;color:var(--muted);font-weight:700}
.bar-col.bar-current .bar-label{color:var(--navy-dark);font-weight:800}

/* ===== Goal progress ===== */
.goal-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:12.5px;font-weight:700}
.goal-bar{height:10px;background:var(--navy-tint);border-radius:10px;overflow:hidden}
.goal-fill{height:100%;border-radius:10px;background:linear-gradient(90deg,var(--navy),var(--amber));transition:width .4s}

/* ===== Calendar ===== */
.cal-head{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:14px;font-family:'Inter',sans-serif;font-size:14px}
.cal-nav{display:flex;gap:6px}
.cal-nav button{width:30px;height:30px;border-radius:9px;border:1px solid var(--border);background:var(--panel-solid);cursor:pointer;display:grid;place-items:center}
.cal-week,.cal-days{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.cal-week{font-size:10px;color:var(--muted);font-weight:700;margin-bottom:8px;text-transform:uppercase}
.cal-days{gap:5px 0;font-size:12px}
.cal-day{height:36px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;border-radius:10px;cursor:pointer}
.cal-day.muted{color:#c9beb6}
body.dark .cal-day.muted{color:#4a4046}
.cal-day:not(.muted):hover{background:var(--navy-tint)}
.cal-day.today{background:var(--navy-tint);font-weight:800;color:var(--navy-dark)}
.cal-day.selected{background:var(--navy);color:#fff;font-weight:800}
.cal-dots{position:absolute;bottom:4px;display:flex;gap:2px}
.cal-dot{width:4px;height:4px;border-radius:50%;background:var(--rose)}
.cal-dot-followup{background:var(--navy)}
.cal-dot-project{background:var(--amber)}
.cal-dot-invoice{background:var(--rose)}
.cal-day.selected .cal-dot{background:#fff}
.cal-day.selected .cal-dot-followup,.cal-day.selected .cal-dot-project,.cal-day.selected .cal-dot-invoice{background:#fff}
.cal-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);font-weight:600}
.cal-legend span{display:flex;align-items:center;gap:5px}
.cal-legend .cal-dot{position:static}

/* ===== Search ===== */
.search-box{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:9px 12px;margin-bottom:14px}
.search-box input{border:none;background:transparent;outline:none;flex:1;min-width:0;font-size:13.5px;color:var(--text);text-overflow:ellipsis}
.search-box .icon{color:var(--muted);flex:none}
.search-clear-btn{width:20px;height:20px;border-radius:50%;border:none;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;flex:none;padding:0;box-sizing:border-box;transition:color .15s}
.search-clear-btn:hover{color:var(--text)}
.search-clear-btn .icon{width:10px;height:10px;color:inherit}
.search-hl{background:var(--navy-tint);color:var(--navy-dark);border-radius:3px;padding:0 2px;font-weight:800}
body.dark .search-hl{background:#33445e;color:var(--amber-2)}

/* ===== Empty state ===== */
.empty-state{display:flex;flex-direction:column;align-items:center;gap:12px;padding:36px 20px;color:var(--muted);text-align:center;font-size:13.5px}
.empty-state .icon{width:30px;height:30px;opacity:.5}
.empty-hero{text-align:center;padding:54px 20px}
.profile-header{padding-bottom:20px}
.profile-header-top{display:flex;align-items:flex-start;gap:14px}
.profile-header-top .avatar{width:52px;height:52px;font-size:16px}
.profile-id{flex:1;min-width:0}
.profile-id h2{font-family:'Inter',sans-serif;font-size:19px;font-weight:800;margin:0 0 2px;letter-spacing:-.2px}
.profile-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.tag-chip{background:var(--navy-tint);color:var(--navy-dark);font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.filter-bar select{padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:12.5px;font-family:inherit;cursor:pointer}
.tag-filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tag-chip-btn{border:1px solid var(--border);cursor:pointer;background:var(--panel-solid);color:var(--muted);transition:background .15s,color .15s,border-color .15s}
.tag-chip-btn:hover{background:var(--navy-tint)}
.tag-chip-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.filter-count{font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:8px}
.help-group-label{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:0 6px 8px}
.activation-box{background:linear-gradient(135deg,var(--navy-tint),#fff8ef);border:1px solid var(--navy-tint);border-radius:16px;padding:16px;margin-bottom:22px}
body.dark .activation-box{background:linear-gradient(135deg,#2b2530,#241f28);border-color:#3d3742}
body.dark .activation-box input{background:var(--panel-solid);border-color:#3d3742;color:#fff}
.activation-head{display:flex;align-items:flex-start;gap:12px}
.activation-head .icon{width:20px;height:20px;color:var(--navy);flex:none;margin-top:2px}
.activation-head b{font-family:'Inter',sans-serif;font-size:14px}
.activation-head p{margin:3px 0 0;font-size:12px;color:var(--muted);line-height:1.5}
.activation-box input{width:100%;border:1.3px solid var(--border);border-radius:9px;padding:9px 12px;font-size:13px;font-family:inherit;background:#fff;letter-spacing:.5px}
.activation-done{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#e4f9f2,#f0fdf7);border-color:#c9f0e2}
body.dark .activation-done{background:linear-gradient(135deg,#173229,#152a24);border-color:#1f4536}
body.dark .activation-done p,body.dark .activation-head p{color:var(--muted)}
.activation-done .icon{width:22px;height:22px;color:var(--sage);flex:none}
.activation-done b{font-family:'Inter',sans-serif;font-size:14px}
.activation-done p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.lifetime-note{display:flex;align-items:flex-start;gap:8px;background:#e4f9f2;border:1px solid #c9f0e2;border-radius:10px;padding:9px 11px;margin-top:12px;font-size:11.5px;line-height:1.5;color:#0d8a68}
.lifetime-note .icon{width:14px;height:14px;flex:none;margin-top:1px;color:var(--sage)}
body.dark .lifetime-note{background:#173229;border-color:#1f4536;color:#7fe0c0}
.demo-strip{display:flex;align-items:center;gap:8px;width:100%;border:1px solid #ffe0a3;background:#fff4df;color:#a35d00;font-size:11.5px;font-weight:700;padding:10px 12px;border-radius:12px;margin:0 0 14px;cursor:pointer;font-family:inherit;text-align:left}
.demo-strip .icon{width:14px;height:14px;flex:none}
.demo-strip:hover{background:#ffe9c2}
body.dark .demo-strip{background:#3a2f18;color:#ffcf87;border-color:#4a3d22}
.ciq-dash-card{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--navy) 0%,var(--amber) 100%);border:none;border-radius:20px;padding:18px 22px;margin-bottom:16px;cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.ciq-dash-card::after{content:"";position:absolute;top:-40%;right:-6%;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
.ciq-dash-card:hover{transform:translateY(-2px)}
.ciq-dash-icon{width:50px;height:50px;border-radius:15px;background:rgba(255,255,255,.2);color:#fff;display:grid;place-items:center;flex:none;position:relative;z-index:1}
.ciq-dash-icon .icon{width:24px;height:24px}
.ciq-dash-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;position:relative;z-index:1}
.ciq-dash-text b{font-size:15px;font-weight:800;color:#fff}
.ciq-dash-text span{font-size:12px;color:rgba(255,255,255,.85)}
.ciq-dash-card .btn{flex:none;position:relative;z-index:1;background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff}
.ciq-dash-card .btn:hover{background:rgba(255,255,255,.26)}
.ciq-start{text-align:center;padding:44px 24px}
.ciq-hero-icon{width:64px;height:64px;border-radius:20px;background:linear-gradient(120deg,var(--navy) 0%,var(--amber) 100%);color:#fff;display:grid;place-items:center;margin:0 auto 18px}
.ciq-hero-icon .icon{width:32px;height:32px}
.ciq-start h2{font-family:'Inter',sans-serif;font-size:24px;margin:0 0 8px}
.ciq-sub{font-size:14.5px;font-weight:700;color:var(--text);margin:0 0 6px}
.ciq-desc{font-size:13px;color:var(--muted);max-width:420px;margin:0 auto 18px;line-height:1.6}
.ciq-meta-row{display:flex;align-items:center;justify-content:center;gap:10px;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:14px}
.ciq-best{display:inline-block;background:var(--navy-tint);color:var(--navy-dark);font-size:12.5px;font-weight:700;padding:8px 16px;border-radius:999px;margin-bottom:20px}
.ciq-empty-note{font-size:13px;color:var(--muted);max-width:360px;margin:0 auto 18px;line-height:1.6}
.ciq-start-btn{margin:0 auto;padding:13px 28px;font-size:14px}
.ciq-panel{max-width:640px;margin:0 auto;padding:28px}
.ciq-topbar-row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:10px}
.ciq-progress-bar{height:8px;background:var(--navy-tint);border-radius:10px;overflow:hidden;margin-bottom:18px}
.ciq-progress-fill{height:100%;background:linear-gradient(90deg,var(--navy),var(--amber));border-radius:10px;transition:width .4s}
.ciq-badge{display:inline-block;font-size:11px;font-weight:800;padding:5px 12px;border-radius:999px;margin-bottom:12px}
.ciq-badge-personal{background:var(--navy-tint);color:var(--navy-dark)}
.ciq-badge-scenario{background:#fef3e2;color:#b8770e}
body.dark .ciq-badge-scenario{background:#3a2f1a;color:#e0a028}
.ciq-question{font-family:'Inter',sans-serif;font-size:19px;font-weight:800;line-height:1.4;margin:0 0 20px}
.ciq-options{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.ciq-option{text-align:left;padding:14px 18px;border-radius:14px;border:1.5px solid var(--border);background:var(--panel-solid);font-size:14px;font-weight:600;color:var(--text);cursor:pointer;transition:border-color .15s,background .15s,transform .1s}
.ciq-option:hover:not(:disabled){border-color:var(--navy);transform:translateX(2px)}
.ciq-option:disabled{cursor:default}
.ciq-option.ciq-correct{border-color:var(--sage);background:#e5f8ee;color:#1a7a4c}
.ciq-option.ciq-incorrect{border-color:var(--rose);background:#fceaeb;color:#b02a35}
.ciq-option.ciq-disabled{opacity:.5}
body.dark .ciq-option.ciq-correct{background:#123422;color:#5fd394}
body.dark .ciq-option.ciq-incorrect{background:#3a1a1e;color:#f08a92}
.ciq-feedback{margin:16px 0;padding:14px 16px;border-radius:14px;font-size:13.5px}
.ciq-feedback-correct{background:#e5f8ee;color:#1a7a4c}
.ciq-feedback-wrong{background:#fceaeb;color:#b02a35}
body.dark .ciq-feedback-correct{background:#123422;color:#5fd394}
body.dark .ciq-feedback-wrong{background:#3a1a1e;color:#f08a92}
.ciq-feedback p{margin:6px 0 0;font-weight:500;opacity:.9}
.ciq-next-btn{width:100%;justify-content:center;padding:13px}
.ciq-results{text-align:center;padding:44px 24px;max-width:520px;margin:0 auto}
.ciq-results h2{font-family:'Inter',sans-serif;font-size:22px;margin:0 0 18px}
.ciq-result-level{font-size:26px;font-weight:800;margin-bottom:10px}
.ciq-result-score{font-size:16px;font-weight:700;color:var(--text);margin-bottom:4px}
.ciq-result-points{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:22px}
.ciq-result-breakdown{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:26px}
.ciq-result-breakdown div{background:var(--navy-tint);border-radius:14px;padding:14px 8px}
.ciq-result-breakdown b{display:block;font-size:17px;font-weight:800}
.ciq-result-breakdown span{font-size:11px;color:var(--muted);font-weight:700}
.ciq-result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
@media(max-width:600px){.ciq-panel,.ciq-start,.ciq-results{padding:24px 18px}.ciq-dash-card{flex-wrap:wrap}.ciq-dash-card .btn{width:100%;justify-content:center}}
.funnel{display:flex;flex-direction:column;gap:12px}
.funnel-row{display:flex;align-items:center;gap:12px}
.funnel-label{width:78px;font-size:12.5px;font-weight:700;color:var(--text);flex:none}
.funnel-bar-wrap{flex:1;background:var(--navy-tint);border-radius:9px;overflow:hidden;height:34px;position:relative}
.funnel-bar{height:100%;border-radius:9px;background:linear-gradient(90deg,var(--navy),var(--amber));display:flex;align-items:center;padding-left:12px;color:#fff;font-weight:800;font-size:13px;transition:width .8s cubic-bezier(.16,1,.3,1);min-width:0}
.funnel-pct{width:42px;text-align:right;font-size:12px;font-weight:700;color:var(--muted);flex:none}
.csv-export-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.csv-export-grid .btn{justify-content:center}
@media(max-width:600px){.csv-export-grid{grid-template-columns:repeat(2,1fr)}}
.profile-contact-grid{display:flex;flex-wrap:wrap;gap:16px;margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
.profile-contact-item{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text)}
.profile-contact-item .icon{width:15px;height:15px;color:var(--muted);flex:none}
.profile-notes{margin:14px 0 0;font-size:13px;color:var(--muted);line-height:1.6;padding-top:14px;border-top:1px solid var(--border)}
.profile-stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.profile-stat{background:var(--navy-tint);border-radius:14px;padding:14px}
.profile-stat-val{font-family:'Inter',sans-serif;font-size:18px;font-weight:800}
.profile-stat-label{font-size:11px;color:var(--muted);font-weight:600;margin-top:3px}
@media(max-width:520px){.profile-stat-row{grid-template-columns:1fr}.profile-header-top{flex-wrap:wrap}}
.empty-hero-icon{width:52px;height:52px;border-radius:16px;background:var(--navy-tint);color:var(--navy-dark);display:grid;place-items:center;margin:0 auto 16px;box-shadow:0 8px 20px rgba(255,97,82,.16)}
.empty-hero h3{font-family:'Inter',sans-serif;font-size:16px;margin:0 0 6px}
.empty-hero p{color:var(--muted);font-size:13px;margin:0 0 18px}

/* ===== Modal ===== */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(30,15,15,.5);z-index:100;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
.modal-overlay.show{display:flex}
.modal{background:var(--panel-solid);border-radius:22px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding:22px;box-shadow:0 30px 70px rgba(40,20,15,.3)}
.modal.onboard{max-width:420px;text-align:center;padding:30px 26px}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-head h2{font-family:'Inter',sans-serif;font-size:17px;font-weight:800}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-family:inherit;font-size:13.5px}
.field textarea{resize:vertical;min-height:70px}
.modal-actions{display:flex;gap:8px;margin-top:18px}
.onboard-icon{width:60px;height:60px;border-radius:18px;background:linear-gradient(135deg,var(--navy),var(--amber));display:grid;place-items:center;margin:0 auto 16px;box-shadow:0 10px 24px rgba(255,97,82,.3)}
.onboard-icon .icon{width:28px;height:28px;stroke:#fff}
.onboard-steps{text-align:left;display:grid;gap:12px;margin:18px 0}
.onboard-step{display:flex;gap:12px;align-items:flex-start}
.onboard-step .os-ic{width:32px;height:32px;border-radius:10px;background:var(--navy-tint);color:var(--navy-dark);display:grid;place-items:center;flex:none}
.onboard-step b{display:block;font-size:13px}
.onboard-step span{font-size:12px;color:var(--muted)}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy-dark);color:#fff;padding:11px 20px;border-radius:14px;font-size:13px;font-weight:600;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}

.theme-swatch{width:36px;height:36px;border-radius:50%;border:2px solid transparent;cursor:pointer;display:grid;place-items:center;color:#fff;transition:transform .15s;padding:0}
.theme-swatch:hover{transform:translateY(-2px) scale(1.06)}
.theme-swatch.active{border-color:var(--text)}
.theme-swatch .icon{width:14px;height:14px}
.theme-swatch:hover{transform:translateY(-2px)}
.font-option{padding:10px 14px;border-radius:12px;border:1px solid var(--border);background:var(--panel-solid);cursor:pointer;text-align:center;transition:transform .15s}
.font-option.active{border-color:var(--navy);background:var(--navy-tint)}
.lock-badge .icon{width:13px;height:13px}

@media(max-width:850px){
  .app{grid-template-columns:1fr;padding:10px}
  .sidebar{position:fixed;z-index:70;left:10px;top:10px;bottom:10px;height:auto;width:270px;transform:translateX(-130%);transition:transform .3s;box-shadow:0 30px 70px rgba(10,15,25,.35)}
  .sidebar.open{transform:translateX(0)}
  .sidebar .brand{padding-bottom:16px;margin-bottom:6px;border-bottom:1px solid var(--border);position:relative}
  .sidebar-close{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;border:1px solid var(--border);background:var(--panel-solid);color:var(--muted);cursor:pointer;margin-left:auto;flex:none;transition:background .15s,color .15s}
  .sidebar-close:hover{background:var(--navy-tint);color:var(--navy-dark)}
  .sidebar-close .icon{width:15px;height:15px}
  .sidebar .nav button{font-size:15px;font-weight:700;color:var(--text);padding:13px 14px;gap:13px}
  .sidebar .nav button .icon{width:19px;height:19px}
  .sidebar .nav button.active{color:var(--navy-dark)}
  .sidebar .nav-section{font-size:11px;padding:18px 14px 8px}
}
@media(min-width:851px){.sidebar-close{display:none}}
</style>

function loadState(){
  let isFirstRun = false;
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ state = JSON.parse(raw); }
    else{ state = defaultState(); isFirstRun = true; }
  }catch(e){ state = defaultState(); isFirstRun = true; }
  if(!state.settings) state.settings = defaultState().settings;
  if(!state.settings.accentTheme) state.settings.accentTheme='grape';
  if(!state.settings.fontChoice) state.settings.fontChoice='classic';
  if(typeof state.settings.demoCreditsUsed!=='number') state.settings.demoCreditsUsed=0;
  if(typeof state.settings.revenueGoal!=='number') state.settings.revenueGoal=0;
  if(!state.settings.clientIQ) state.settings.clientIQ={bestScore:0,bestCorrect:0,bestLevel:''};
  if(!state.settings.streak) state.settings.streak={count:0,best:0,lastCheckDate:null};
  if(typeof state.settings.invoiceCounter!=='number') state.settings.invoiceCounter=state.invoices.length;
  state.invoices.forEach(function(inv){
    if(typeof inv.amountPaid!=='number'){ inv.amountPaid = inv.status==='paid' ? Number(inv.amount||0) : 0; }
    if(!inv.invoiceNumber){ inv.invoiceNumber = nextInvoiceNumber(); }
  });
  state.projects.forEach(function(p){
    if(typeof p.value!=='number') p.value=0;
    if(typeof p.amountPaid!=='number') p.amountPaid=0;
    if(!p.startDate) p.startDate='';
  });
  state.clients.forEach(function(c){
    if(!c.tags) c.tags=[];
    if(!c.links) c.links=[];
    if(!c.priority) c.priority='Medium';
    if(!c.clientType) c.clientType='Individual';
    if(!c.address) c.address='';
    if(!c.followUpStatus) c.followUpStatus='Not Contacted';
  });
  return isFirstRun;
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

/* ============ HELPERS ============ */
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function iconSvg(name){ return '<svg class="icon" aria-hidden="true"><use href="#'+name+'"></use></svg>'; }
function fmtMoney(n){ return state.settings.currency + Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2}); }
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
function initials(name){ return (name||'?').trim().split(/\s+/).map(function(w){return w[0];}).slice(0,2).join('').toUpperCase(); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(window._toastT); window._toastT=setTimeout(function(){t.classList.remove('show');},2200); }
function emptyState(msg){ return '<div class="empty-state">'+iconSvg('i-file')+'<div>'+esc(msg)+'</div></div>'; }
function highlightMatch(text,query){
  text = text||'';
  if(!query) return esc(text);
  const idx = text.toLowerCase().indexOf(query.toLowerCase());
  if(idx===-1) return esc(text);
  return esc(text.slice(0,idx))+'<span class="search-hl">'+esc(text.slice(idx,idx+query.length))+'</span>'+esc(text.slice(idx+query.length));
}
function clientById(id){ return state.clients.find(function(c){return c.id===id;}); }
function stagePill(stage){ const labels={lead:'Lead',contacted:'Contacted',active:'Active',done:'Done'}; return '<span class="pill pill-'+stage+'">'+labels[stage]+'</span>'; }
function invoiceStatusOf(inv){
  const paid=Number(inv.amountPaid||0), amt=Number(inv.amount||0);
  if(inv.status==='paid' || (amt>0 && paid>=amt)) return 'paid';
  if(paid>0 && paid<amt) return 'partial';
  if(inv.dueDate && inv.dueDate < todayISO()) return 'overdue';
  return 'unpaid';
}
function invoicePill(inv){ const st=invoiceStatusOf(inv); const labels={paid:'Paid',unpaid:'Unpaid',overdue:'Overdue',partial:'Partially paid'}; return '<span class="pill pill-'+st+'">'+labels[st]+'</span>'; }

/* Signature element: follow-up urgency ring around each client avatar */
function ringColor(c){
  if(!c.nextFollowUp) return 'transparent';
  if(c.nextFollowUp < todayISO()) return 'var(--rose)';
  if(c.nextFollowUp === todayISO()) return 'var(--warn)';
  return 'var(--sage)';
}
function avatarHTML(c){ return '<div class="avatar" style="--ring-color:'+ringColor(c)+'">'+initials(c.name)+'</div>'; }

function requireActivation(feature){ toast(feature+' is available in the full version'); }

function demoLimitReached(){ return DEMO_BUILD && !state.settings.activated && demoCreditsUsed()>=DEMO_CREDIT_LIMIT; }

function greetingLine(){
  const h=new Date().getHours();
  const period = h<12?'Good morning':(h<18?'Good afternoon':'Good evening');

let dashboardRefDate = todayISO();
function fmtRefDate(iso){
  if(iso===todayISO()) return 'Today · '+new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
  const d=new Date(iso+'T00:00:00'), t=new Date(todayISO()+'T00:00:00');
  const diffDays = Math.round((d-t)/86400000);
  const label = diffDays===-1?'Yesterday':(diffDays===1?'Tomorrow':d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}));
  return label;
}
function dateNavHTML(){
  return '<button onclick="shiftDashboardDate(-1)" aria-label="Previous day">'+iconSvg('i-chevron-l')+'</button>'+
    '<span class="date-nav-label" id="dateNavLabel">'+fmtRefDate(dashboardRefDate)+'</span>'+
    '<button onclick="shiftDashboardDate(1)" aria-label="Next day">'+iconSvg('i-chevron-r')+'</button>'+
    (dashboardRefDate!==todayISO() ? '<button class="date-today-btn" onclick="resetDashboardDate()">Today</button>' : '');
}
function shiftDashboardDate(delta){
  const d=new Date(dashboardRefDate+'T00:00:00');
  d.setDate(d.getDate()+delta);
  dashboardRefDate = toLocalISO(d);
  refreshDashboardDate();
}
function resetDashboardDate(){ dashboardRefDate = todayISO(); refreshDashboardDate(); }
function refreshDashboardDate(){
  const label=document.getElementById('dateNavLabel');

  setTimeout(function(){
    document.getElementById('dateNav').innerHTML = dateNavHTML();

    const fresh=document.getElementById('dateNavLabel');
    if(fresh){ fresh.classList.add('fade'); requestAnimationFrame(function(){ requestAnimationFrame(function(){ fresh.classList.remove('fade'); }); }); }
  },160);
}

    document.getElementById('pageTitle').textContent = PAGE_TITLES[view]||'';
    document.getElementById('dateNav').innerHTML = '';

  document.getElementById('topbarActions').innerHTML = topbarActionsHTML(view);
  const gsWrap=document.getElementById('globalSearchWrap');
  if(gsWrap) gsWrap.style.display = (view==='dashboard') ? '' : 'none';

  else if(view==='clientProfile') root.innerHTML=viewClientProfile(currentProfileClientId);
  else if(view==='pipeline') root.innerHTML=viewPipeline();
  else if(view==='projects') root.innerHTML=viewProjects();
  else if(view==='invoices') root.innerHTML=viewInvoices();

function dismissedSet(){
  if(!state.settings.dismissedAlerts) state.settings.dismissedAlerts=[];
  return new Set(state.settings.dismissedAlerts);
}
function alertKey(a){ return a.type==='followup' ? 'f:'+a.client.id : 'i:'+a.invoice.id; }
function getAlerts(){
  const dismissed=dismissedSet();
  const alerts=[];
  state.clients.forEach(function(c){
    if(c.nextFollowUp && c.nextFollowUp<=todayISO()){
      alerts.push({type:'followup',client:c,overdue:c.nextFollowUp<todayISO()});
    }
  });
  state.invoices.forEach(function(i){
    if(invoiceStatusOf(i)==='overdue'){ alerts.push({type:'invoice',invoice:i}); }
  });
  return alerts.filter(function(a){ return !dismissed.has(alertKey(a)); });
}

/* ============ CHART HELPERS ============ */
function donutChart(segments,opts){
  opts=opts||{};
  const realTotal = segments.reduce(function(a,s){return a+s.value;},0);
  const total = realTotal || 1;
  let offset=0;
  const r=60, c=2*Math.PI*r;
  const circles = segments.map(function(s){
    const frac = s.value/total;
    const dash = frac*c;
    const circle = '<circle cx="75" cy="75" r="'+r+'" fill="none" stroke="'+s.color+'" stroke-width="16" stroke-dasharray="'+dash+' '+(c-dash)+'" stroke-dashoffset="'+(-offset)+'" stroke-linecap="butt"/>';
    offset += dash;
    return circle;
  }).join('');
  const track = realTotal===0 ? '<circle cx="75" cy="75" r="'+r+'" fill="none" stroke="var(--border)" stroke-width="16"/>' : '';
  const centerVal = opts.centerVal!==undefined ? opts.centerVal : realTotal;
  const centerLabel = opts.centerLabel!==undefined ? opts.centerLabel : 'clients';
  return '<div class="donut-chart"><svg viewBox="0 0 150 150">'+track+circles+'</svg><div class="donut-center"><b>'+centerVal+'</b>'+centerLabel+'</div></div>';
}
function barChart(data,opts){
  opts=opts||{};
  const chartId=opts.chartId||'reportsBarChart';
  const fmt=opts.fmt||fmtMoney;
  const max = Math.max.apply(null,data.map(function(d){return d.value;}).concat([1]));
  const html = '<div class="bar-chart" id="'+chartId+'">'+data.map(function(d,i){
    const h = Math.max(3, Math.round((d.value/max)*100));
    const isCurrent = i===data.length-1;
    return '<div class="bar-col'+(isCurrent?' bar-current':'')+'" data-h="'+h+'"><div class="bar-value">'+fmt(d.value)+'</div><div class="bar-fill-wrap"><div class="bar-fill" style="height:0%" title="'+fmt(d.value)+'"></div></div><div class="bar-label">'+d.label+'</div></div>';
  }).join('')+'</div>';
  setTimeout(function(){
    const chart=document.getElementById(chartId);
    if(!chart) return;
    chart.querySelectorAll('.bar-col').forEach(function(col){
      const h=col.getAttribute('data-h');
      col.querySelector('.bar-fill').style.height=h+'%';
      col.classList.add('bar-in');
    });
  },50);
  return html;
}

/* ============ DASHBOARD ============ */
function updateStreak(){
  if(!state.settings.streak) state.settings.streak={count:0,best:0,lastCheckDate:null};
  const s=state.settings.streak;
  const today=todayISO();
  const hasOverdue = state.clients.some(function(c){return c.nextFollowUp && c.nextFollowUp<today;});
  if(state.clients.length===0){
    s.count=0;
  }else if(hasOverdue){
    s.count=0;
  }else if(s.lastCheckDate===today){
    if(s.count===0) s.count=1;
  }else if(s.lastCheckDate===null){
    s.count=1;
  }else{
    const prev=new Date(s.lastCheckDate+'T00:00:00');
    const diffDays=Math.round((new Date(today+'T00:00:00')-prev)/86400000);
    if(diffDays===1){ s.count=s.count+1; }
    else{ s.count=1; }
  }
  s.best=Math.max(s.best||0,s.count);
  s.lastCheckDate=today;
  saveState();
}
function streakMessage(n){
  if(state.clients.length===0) return 'Add your first client to start a follow-up streak';
  if(n===0) return 'Log a follow-up today to start a new streak';
  if(n<3) return 'Nice start — keep it going';
  if(n<7) return 'Building real momentum';
  if(n<14) return 'One week strong!';
  if(n<30) return 'Incredible consistency';
  return 'Client relationship master';
}

function allClientTags(){
  const set=new Set();
  state.clients.forEach(function(c){ (c.tags||[]).forEach(function(t){ set.add(t); }); });
  return Array.from(set).sort();

function allClientTypes(){
  const std=['Individual','Business','Agency','Freelancer'];
  const set=new Set(std);
  state.clients.forEach(function(c){ if(c.clientType) set.add(c.clientType); });
  return Array.from(set).sort(function(a,b){
    const ai=std.indexOf(a), bi=std.indexOf(b);
    if(ai>-1 && bi>-1) return ai-bi;
    if(ai>-1) return -1;
    if(bi>-1) return 1;
    return a.localeCompare(b);
  });
}

      return '<button class="tag-chip tag-chip-btn'+(active?' active':'')+'" onclick="toggleClientTagFilter(\''+esc(t).replace(/'/g,"\\'")+'\')">'+esc(t)+'</button>';
    }).join('')+'</div>';
  }
  html+='</div>';
  return html;
}
function toggleClientTagFilter(tag){
  const idx=clientFilters.tags.indexOf(tag);
  if(idx>-1) clientFilters.tags.splice(idx,1); else clientFilters.tags.push(tag);
  updateClientsList();
}
function clearClientFilters(){
  clientFilters={stage:'',priority:'',clientType:'',added:'',tags:[]};
  updateClientsList();
}
function clientsListHTML(){
  const q=clientSearch.trim().toLowerCase();
  let filtered = q ? state.clients.filter(function(c){
    return (c.name+' '+(c.company||'')+' '+(c.email||'')+' '+(c.phone||'')+' '+(c.notes||'')+' '+((c.tags||[]).join(' '))).toLowerCase().indexOf(q)>-1;
  }) : state.clients.slice();
  if(clientFilters.stage) filtered=filtered.filter(function(c){return c.stage===clientFilters.stage;});
  if(clientFilters.priority) filtered=filtered.filter(function(c){return c.priority===clientFilters.priority;});
  if(clientFilters.clientType) filtered=filtered.filter(function(c){return c.clientType===clientFilters.clientType;});
  if(clientFilters.added){
    const today=todayISO();
    filtered=filtered.filter(function(c){
      if(!c.createdAt) return false;
      if(clientFilters.added==='month') return c.createdAt.slice(0,7)===today.slice(0,7);
      const days=parseInt(clientFilters.added,10);
      return daysBetween(c.createdAt,today)<=days && daysBetween(c.createdAt,today)>=0;
    });
  }
  if(clientFilters.tags.length){
    filtered=filtered.filter(function(c){ return clientFilters.tags.every(function(t){ return (c.tags||[]).indexOf(t)>-1; }); });
  }
  const anyFilterActive = q || clientFilters.stage || clientFilters.priority || clientFilters.clientType || clientFilters.added || clientFilters.tags.length;
  const countLabel = anyFilterActive ? '<div class="filter-count">'+filtered.length+' of '+state.clients.length+' clients</div>' : '';
  const list = filtered.length ? filtered.map(function(c){
    const proj = state.projects.filter(function(p){return p.clientId===c.id;}).length;
    return '<div class="list-row" onclick="openClientProfile(\''+c.id+'\')">'+avatarHTML(c)+
      '<div class="row-main"><div class="row-title">'+highlightMatch(c.name,q)+'</div><div class="row-sub">'+highlightMatch(c.company||'No company',q)+' · '+proj+' project(s)</div></div>'+
      stagePill(c.stage)+
    '</div>';
  }).join('') : emptyState(anyFilterActive?'No clients match these filters.':'No clients yet.');
  return countLabel + list;
}
function updateClientsList(){
  const wrap=document.getElementById('clientsListWrap'); if(wrap) wrap.innerHTML=clientsListHTML();
  const btn=document.getElementById('clientSearchClearBtn'); if(btn) btn.style.display=clientSearch?'flex':'none';
  const bar=document.getElementById('clientFilterBar'); if(bar) bar.outerHTML=clientFilterBarHTML();
}
function clearClientSearch(){

  const inp=document.getElementById('clientSearchInput'); if(inp) inp.value='';

}

function toggleCustomClientType(){
  const sel=document.getElementById('f_ctype2');

function saveClient(id){
  const name=document.getElementById('f_name').value.trim();
  if(!name){ toast('Client name is required'); return; }
  if(!id && !useDemoCredit()) return;
  const tagsRaw=document.getElementById('f_tags').value.trim();
  const data={
    name:name, company:document.getElementById('f_company').value.trim(),
    email:document.getElementById('f_email').value.trim(), phone:document.getElementById('f_phone').value.trim(),
    address:document.getElementById('f_address').value.trim(),
    stage:document.getElementById('f_stage').value, nextFollowUp:document.getElementById('f_followup').value||null,
    followUpStatus:document.getElementById('f_fustatus').value,
    clientType: (document.getElementById('f_ctype2').value==='Other') ? (document.getElementById('f_ctypecustom').value.trim()||'Other') : document.getElementById('f_ctype2').value,
    priority:document.getElementById('f_priority').value,
    tags: tagsRaw ? tagsRaw.split(',').map(function(t){return t.trim();}).filter(Boolean) : [],
    notes:document.getElementById('f_notes').value.trim()
  };
  if(id){ const c=clientById(id); Object.assign(c,data); toast('Client updated'); }
  else{ data.id=uid(); data.createdAt=todayISO(); data.links=[]; state.clients.push(data); toast('Client added'); }
  saveState(); closeModal();
  if(id && currentView()==='clientProfile'){ navigate('clientProfile',{fromHistory:true,depth:historyDepth,id:id}); }
  else{ navigate(currentView(),{fromHistory:true,depth:historyDepth}); }
}
function confirmDeleteClient(id){
  const c=clientById(id); if(!c) return;
  askConfirm('Delete '+c.name+'? This will also remove their projects, invoices, and contact history from view. This cannot be undone.',function(){ deleteClient(id); });
}
function deleteClient(id){
  state.clients = state.clients.filter(function(c){return c.id!==id;});
  saveState(); closeModal(); toast('Client deleted'); navigate('clients',{fromHistory:true,depth:historyDepth});
}

/* ============ CLIENT PROFILE ============ */
function daysBetween(iso1,iso2){
  const d1=new Date(iso1+'T00:00:00'), d2=new Date(iso2+'T00:00:00');
  return Math.round((d2-d1)/86400000);
}
function priorityPill(p){
  if(!p) return '';
  const cls = p==='High'?'pill-overdue':(p==='Low'?'pill-lead':'pill-contacted');
  return '<span class="pill '+cls+'">'+p+' priority</span>';
}
function tagChipsHTML(tags){
  if(!tags||!tags.length) return '';
  return '<div class="tag-chips">'+tags.map(function(t){return '<span class="tag-chip">'+esc(t)+'</span>';}).join('')+'</div>';
}
function viewClientProfile(id){
  const c=clientById(id);
  if(!c) return emptyHero('i-users','Client not found','This client may have been deleted.','navigate(\'clients\')','Back to clients');

  const projects = state.projects.filter(function(p){return p.clientId===id;});
  const invoices = state.invoices.filter(function(i){return i.clientId===id;});
  const comms = state.communications.filter(function(l){return l.clientId===id;}).slice().sort(function(a,b){return a.date<b.date?1:-1;});

  const totalValue = invoices.reduce(function(a,i){return a+Number(i.amount||0);},0);
  const totalPaid = invoices.reduce(function(a,i){return a+Number(i.amountPaid||0);},0);
  const outstanding = totalValue-totalPaid;

  const lastContact = comms.length ? comms[0].date : null;
  const daysSince = lastContact ? daysBetween(lastContact,todayISO()) : null;
  const daysUntil = c.nextFollowUp ? daysBetween(todayISO(),c.nextFollowUp) : null;

  const header = '<div class="panel profile-header">'+
    '<div class="profile-header-top">'+avatarHTML(c)+
      '<div class="profile-id"><h2>'+esc(c.name)+'</h2><div class="row-sub">'+esc(c.company||'No company')+'</div>'+
        '<div class="profile-badges">'+stagePill(c.stage)+priorityPill(c.priority)+(c.clientType?'<span class="pill pill-lead">'+esc(c.clientType)+'</span>':'')+'</div>'+
      '</div>'+
      '<button class="btn btn-outline btn-sm" onclick="openClientModal(\''+c.id+'\')">'+iconSvg('i-edit')+'Edit</button>'+
    '</div>'+
    tagChipsHTML(c.tags)+
    '<div class="profile-contact-grid">'+
      (c.email?'<div class="profile-contact-item">'+iconSvg('i-mail')+'<span>'+esc(c.email)+'</span></div>':'')+
      (c.phone?'<div class="profile-contact-item">'+iconSvg('i-phone')+'<span>'+esc(c.phone)+'</span></div>':'')+
      (c.address?'<div class="profile-contact-item">'+iconSvg('i-home')+'<span>'+esc(c.address)+'</span></div>':'')+
    '</div>'+
    (c.notes?'<p class="profile-notes">'+esc(c.notes)+'</p>':'')+
  '</div>';

  const financialPanel = '<div class="panel"><div class="panel-title"><div class="panel-title-left"><div class="panel-title-ic">'+iconSvg('i-chart')+'</div><h2>Financial summary</h2></div></div>'+
    '<div class="profile-stat-row">'+
      '<div class="profile-stat"><div class="profile-stat-val">'+fmtMoney(totalValue)+'</div><div class="profile-stat-label">Total value</div></div>'+
      '<div class="profile-stat"><div class="profile-stat-val" style="color:var(--sage)">'+fmtMoney(totalPaid)+'</div><div class="profile-stat-label">Total paid</div></div>'+
      '<div class="profile-stat"><div class="profile-stat-val" style="color:'+(outstanding>0?'var(--rose)':'var(--text)')+'">'+fmtMoney(outstanding)+'</div><div class="profile-stat-label">Outstanding</div></div>'+
    '</div></div>';

  const isOverdueFollow = c.nextFollowUp && c.nextFollowUp<todayISO();
  const fuStatusCls = {'Not Contacted':'pill-lead','Contacted':'pill-contacted','Waiting':'pill-lead','Follow Up':'pill-overdue','Completed':'pill-active'}[c.followUpStatus]||'pill-lead';
  const followPanel = '<div class="panel"><div class="panel-title"><div class="panel-title-left"><div class="panel-title-ic">'+iconSvg('i-clock')+'</div><h2>Follow-up</h2></div><span class="pill '+fuStatusCls+'">'+esc(c.followUpStatus||'Not Contacted')+'</span></div>'+
    '<div class="profile-stat-row">'+
      '<div class="profile-stat"><div class="profile-stat-val">'+(lastContact?fmtDate(lastContact):'—')+'</div><div class="profile-stat-label">'+(daysSince!==null?daysSince+' day'+(daysSince===1?'':'s')+' ago':'Last contact')+'</div></div>'+
      '<div class="profile-stat" style="'+(isOverdueFollow?'background:#fceaeb':'')+'"><div class="profile-stat-val" style="'+(isOverdueFollow?'color:var(--rose)':'')+'">'+(c.nextFollowUp?fmtDate(c.nextFollowUp):'—')+'</div><div class="profile-stat-label">'+(daysUntil!==null?(daysUntil<0?Math.abs(daysUntil)+' days overdue':(daysUntil===0?'Due today':'In '+daysUntil+' days')):'Next follow-up')+'</div></div>'+
    '</div>'+
    '<button class="btn btn-ghost btn-sm" style="margin-top:12px" onclick="openCommModalFor(\''+c.id+'\')">'+iconSvg('i-plus')+'Log contact</button>'+
  '</div>';

  const projectsPanel = '<div class="panel"><div class="panel-title"><div class="panel-title-left"><div class="panel-title-ic">'+iconSvg('i-briefcase')+'</div><h2>Projects</h2></div>'+
    '<button class="btn btn-ghost btn-sm" onclick="openProjectModalFor(\''+c.id+'\')">'+iconSvg('i-plus')+'Add</button></div>'+
    (projects.length ? projects.map(function(p){
      return '<div class="list-row" onclick="openProjectModal(\''+p.id+'\')">'+
        '<div class="avatar">'+iconSvg('i-briefcase')+'</div>'+
        '<div class="row-main"><div class="row-title">'+esc(p.title)+'</div><div class="row-sub">'+(p.dueDate?'Due '+fmtDate(p.dueDate):'No due date')+(p.value?' · '+fmtMoney(p.value):'')+'</div></div>'+
        '<span class="pill pill-'+(p.status==='done'?'done':(p.status==='in_progress'?'active':'lead'))+'">'+PROJECT_STATUS_LABEL[p.status]+'</span>'+
      '</div>';
    }).join('') : emptyState('No projects yet for this client.'))+
  '</div>';

  const invoicesPanel = '<div class="panel"><div class="panel-title"><div class="panel-title-left"><div class="panel-title-ic">'+iconSvg('i-invoice')+'</div><h2>Invoices</h2></div>'+
    '<button class="btn btn-ghost btn-sm" onclick="openInvoiceModalFor(\''+c.id+'\')">'+iconSvg('i-plus')+'Add</button></div>'+
    (invoices.length ? invoices.slice().reverse().map(function(i){

        invoicePill(i)+

    (comms.length ? comms.map(function(l){
      const icon = (l.type==='call'||l.type==='phone')?'i-phone':(l.type==='email'?'i-mail':(l.type==='meeting'?'i-users':'i-file'));
      return '<div class="list-row" onclick="openCommModal(\''+l.id+'\')">'+
        '<div class="avatar">'+iconSvg(icon)+'</div>'+
        '<div class="row-main"><div class="row-title">'+l.type.charAt(0).toUpperCase()+l.type.slice(1)+'</div><div class="row-sub">'+esc(l.notes||'No notes')+' · '+fmtDate(l.date)+'</div></div>'+

  const links = c.links||[];

  return header + financialPanel + followPanel + '<div class="grid-2">'+projectsPanel+invoicesPanel+'</div>' + commPanel + linksPanel;

function openProjectModalFor(clientId){ openProjectModal(null,clientId); }
function openInvoiceModalFor(clientId){ openInvoiceModal(null,clientId); }
function openCommModalFor(clientId){ openCommModal(null,clientId); }
function openLinkModal(clientId){
  const html='<div class="modal-head"><h2>Add link</h2><button class="btn btn-outline btn-sm" onclick="closeModal()">'+iconSvg('i-close')+'</button></div>'+
    '<div class="field"><label>Label</label><input id="f_linklabel" placeholder="e.g. Contract, Drive folder"/></div>'+

function saveClientLink(clientId){
  const label=document.getElementById('f_linklabel').value.trim();
  let url=document.getElementById('f_linkurl').value.trim();
  if(!label||!url){ toast('Label and URL are required'); return; }
  if(!/^https?:\/\//i.test(url)) url='https://'+url;
  const c=clientById(clientId); if(!c) return;
  if(!c.links) c.links=[];

function deleteClientLink(clientId,idx){
  const c=clientById(clientId); if(!c||!c.links) return;

/* ============ FOLLOW-UPS / CALENDAR ============ */
function viewFollowups(){
  const calendarHTML = buildCalendar();
  const dayFilter = calView.selected;
  let dueSection;
  if(dayFilter){
    const dayEvents = getCalendarEvents().filter(function(e){return e.date===dayFilter;});
    const eventIcon = {followup:'i-clock',project:'i-briefcase',invoice:'i-invoice'};
    const eventPillCls = {followup:'pill-contacted',project:'pill-partial',invoice:'pill-overdue'};
    const eventPillLabel = {followup:'Follow-up',project:'Project',invoice:'Invoice'};
    dueSection = '<div class="panel"><div class="panel-title"><h2>'+fmtDate(dayFilter)+'</h2>'+
      '<button class="btn btn-outline btn-sm" onclick="calView.selected=null;render(\'followups\')">Clear filter</button>'+
      '</div>'+
      (dayEvents.length ? dayEvents.map(function(e){
        return '<div class="list-row" onclick="'+e.onclick+'">'+
          '<div class="avatar">'+iconSvg(eventIcon[e.type])+'</div>'+
          '<div class="row-main"><div class="row-title">'+esc(e.label)+'</div><div class="row-sub">'+esc(e.sub)+'</div></div>'+
          '<span class="pill '+eventPillCls[e.type]+'">'+eventPillLabel[e.type]+'</span>'+
        '</div>';
      }).join('') : emptyState('Nothing due on this day.'))+
    '</div>';
  }else{
    const dueAll = state.clients.filter(function(c){return c.nextFollowUp;});
    const due = dueAll.slice().sort(function(a,b){return a.nextFollowUp<b.nextFollowUp?-1:1;});
    dueSection = '<div class="panel"><div class="panel-title"><h2>Upcoming follow-ups</h2></div>'+
      (due.length ? due.map(function(c){
        const overdue = c.nextFollowUp < todayISO();
        return '<div class="list-row" onclick="openClientProfile(\''+c.id+'\')">'+avatarHTML(c)+
          '<div class="row-main"><div class="row-title">'+esc(c.name)+'</div><div class="row-sub">'+esc(c.company||'')+'</div></div>'+
          '<span class="pill '+(overdue?'pill-overdue':'pill-contacted')+'">'+fmtDate(c.nextFollowUp)+'</span>'+
        '</div>';
      }).join('') : emptyState('No follow-ups scheduled.'))+
    '</div>';
  }

  const commSearchBox = '<div class="search-box" style="margin-bottom:10px">'+iconSvg('i-search')+'<input id="commSearchInput" placeholder="Search contact log..." value="'+esc(window._commSearch||'')+'" oninput="window._commSearch=this.value;updateCommList()"/>'+
    '<button class="search-clear-btn" id="commSearchClearBtn" style="display:'+((window._commSearch)?'flex':'none')+'" onclick="clearCommSearch()" title="Clear search">'+iconSvg('i-close')+'</button></div>';
  const logSection = '<div class="panel"><div class="panel-title"><h2>Contact log</h2></div>'+commSearchBox+'<div id="commListWrap">'+commListHTML()+'</div></div>';
  return '<div class="grid-2">'+calendarHTML+dueSection+'</div>'+logSection;
}

function getCalendarEvents(){
  const events=[];
  state.clients.forEach(function(c){
    if(c.nextFollowUp) events.push({date:c.nextFollowUp,type:'followup',label:c.name,sub:'Follow-up',onclick:"openClientProfile('"+c.id+"')"});
  });
  state.projects.forEach(function(p){
    if(p.dueDate && p.status!=='done'){ const c=clientById(p.clientId); events.push({date:p.dueDate,type:'project',label:p.title,sub:'Project due'+(c?' · '+c.name:''),onclick:"openProjectModal('"+p.id+"')"}); }
  });
  state.invoices.forEach(function(i){
    if(i.dueDate && i.status!=='paid'){ const c=clientById(i.clientId); events.push({date:i.dueDate,type:'invoice',label:fmtMoney(i.amount),sub:'Invoice due'+(c?' · '+c.name:''),onclick:"openInvoiceModal('"+i.id+"')"}); }
  });
  return events;
}
function buildCalendar(){
  const y=calView.y, m=calView.m;
  const first=new Date(y,m,1);
  const startDow=first.getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const daysInPrev=new Date(y,m,0).getDate();
  const monthName=first.toLocaleDateString(undefined,{month:'long',year:'numeric'});
  const events=getCalendarEvents();
  const typesByDate={};
  events.forEach(function(e){ if(!typesByDate[e.date]) typesByDate[e.date]=new Set(); typesByDate[e.date].add(e.type); });
  let cells='';
  for(let i=0;i<startDow;i++){ cells+='<div class="cal-day muted">'+(daysInPrev-startDow+1+i)+'</div>'; }
  for(let d=1;d<=daysInMonth;d++){
    const iso=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const isToday = iso===todayISO();
    const isSel = iso===calView.selected;
    const types = typesByDate[iso];
    const dots = types ? '<span class="cal-dots">'+Array.from(types).map(function(t){return '<i class="cal-dot cal-dot-'+t+'"></i>';}).join('')+'</span>' : '';
    cells+='<div class="cal-day'+(isToday?' today':'')+(isSel?' selected':'')+'" onclick="calView.selected=(calView.selected===\''+iso+'\'?null:\''+iso+'\');render(\'followups\')">'+d+dots+'</div>';
  }
  const totalCells = startDow+daysInMonth;
  const trailing = (7-(totalCells%7))%7;
  for(let i=1;i<=trailing;i++){ cells+='<div class="cal-day muted">'+i+'</div>'; }
  return '<div class="panel">'+
    '<div class="cal-head"><span>'+monthName+'</span><div class="cal-nav">'+
      '<button onclick="calShift(-1)">'+iconSvg('i-chevron-l')+'</button>'+
      '<button onclick="calShift(1)">'+iconSvg('i-chevron-r')+'</button>'+
    '</div></div>'+
    '<div class="cal-week"><div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div></div>'+
    '<div class="cal-days">'+cells+'</div>'+
    '<div class="cal-legend"><span><i class="cal-dot cal-dot-followup"></i>Follow-up</span><span><i class="cal-dot cal-dot-project"></i>Project due</span><span><i class="cal-dot cal-dot-invoice"></i>Invoice due</span></div>'+
  '</div>';
}
function calShift(dir){ calView.m+=dir; if(calView.m>11){calView.m=0;calView.y++;} if(calView.m<0){calView.m=11;calView.y--;} render('followups'); }

/* ============ REPORTS ============ */
function viewReports(){
  if(!state.clients.length) return emptyHero('i-chart','Nothing to report yet','Add clients and invoices to see revenue insights.','navigate(\'clients\')','Add a client');
  const now=new Date();
  const months=[];
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    const total=state.invoices.filter(function(inv){return inv.issueDate && inv.issueDate.slice(0,7)===key;}).reduce(function(a,inv){return a+Number(inv.amountPaid||0);},0);
    months.push({label:d.toLocaleDateString(undefined,{month:'short'}),value:total});
  }
  const trendPanel = '<div class="panel"><div class="panel-title"><h2>Revenue trend</h2><p>Last 6 months</p></div>'+barChart(months)+'</div>';

  const invStatusColors={paid:'var(--sage)',partial:'#e0a028',unpaid:'#c9beb6',overdue:'var(--rose)'};
  const invStatusLabels={paid:'Paid',partial:'Partially paid',unpaid:'Unpaid',overdue:'Overdue'};
  const invStatusData=['paid','partial','unpaid','overdue'].map(function(s){
    const matching=state.invoices.filter(function(i){return invoiceStatusOf(i)===s;});
    return {id:s,label:invStatusLabels[s],value:matching.reduce(function(a,i){return a+Number(i.amount||0);},0),count:matching.length,color:invStatusColors[s]};
  });
  const hasInvoices=state.invoices.length>0;
  const invoiceStatusPanel = '<div class="panel"><div class="panel-title"><div class="panel-title-left"><div class="panel-title-ic">'+iconSvg('i-invoice')+'</div><h2>Invoice status breakdown</h2></div></div>'+
    (hasInvoices ? '<div class="donut-wrap">'+donutChart(invStatusData,{centerVal:state.invoices.length,centerLabel:'invoices'})+
      '<div class="legend">'+invStatusData.map(function(s){return '<div class="legend-row" style="cursor:default"><i style="background:'+s.color+'"></i><span>'+s.label+' ('+s.count+')</span><b>'+fmtMoney(s.value)+'</b></div>';}).join('')+'</div>'+
    '</div>' : emptyState('No invoices yet.'))+
  '</div>';

  const byClient = state.clients.map(function(c){

/* ============ ANALYTICS ============ */
function viewAnalytics(){
  if(!state.clients.length) return emptyHero('i-analytics','Nothing to analyze yet','Add clients, projects, and invoices to see analytics here.','navigate(\'clients\')','Add a client');

  const totalClients = state.clients.length;
  const activeClients = state.clients.filter(function(c){return c.stage==='active'||c.stage==='done';}).length;
  const inactiveClients = totalClients-activeClients;
  const completedProjects = state.projects.filter(function(p){return p.status==='done';}).length;
  const outstanding = state.invoices.reduce(function(a,i){return a+Math.max(0,Number(i.amount||0)-Number(i.amountPaid||0));},0);

  const summaryCards = '<div class="cards">'+
    statCard('i-users','bg-navy',totalClients,'Total clients')+
    statCard('i-check','bg-sage',activeClients,'Active clients')+
    statCard('i-briefcase','bg-amber',completedProjects,'Completed projects')+

  '</div>';

  const stageColors={lead:'#c9beb6',contacted:'var(--navy)',active:'var(--amber)',done:'var(--sage)'};
  const stageCounts=[['lead','Lead'],['contacted','Contacted'],['active','Active'],['done','Done']].map(function(s){

  const statusPanel = '<div class="panel"><div class="panel-title"><div class="panel-title-left"><div class="panel-title-ic">'+iconSvg('i-kanban')+'</div><h2>Client status distribution</h2></div></div>'+

    '</div></div>';

  const activeVsInactivePanel = '<div class="panel"><div class="panel-title"><div class="panel-title-left"><div class="panel-title-ic">'+iconSvg('i-users')+'</div><h2>Active vs inactive</h2></div></div>'+
    '<div class="profile-stat-row" style="grid-template-columns:1fr 1fr">'+
      '<div class="profile-stat"><div class="profile-stat-val" style="color:var(--sage)">'+activeClients+'</div><div class="profile-stat-label">Active</div></div>'+
      '<div class="profile-stat"><div class="profile-stat-val" style="color:var(--muted)">'+inactiveClients+'</div><div class="profile-stat-label">Inactive / Lead</div></div>'+
    '</div></div>';

  const now=new Date();
  const monthsBack=[];
  for(let i=5;i>=0;i--){ monthsBack.push(new Date(now.getFullYear(),now.getMonth()-i,1)); }
  const newClientsMonths = monthsBack.map(function(d){
    const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    const count=state.clients.filter(function(c){return c.createdAt && c.createdAt.slice(0,7)===key;}).length;
    return {label:d.toLocaleDateString(undefined,{month:'short'}),value:count};
  });
  const newClientsPanel = '<div class="panel"><div class="panel-title"><h2>New clients by month</h2><p>Last 6 months</p></div>'+barChart(newClientsMonths,{chartId:'analyticsNewClients',fmt:function(v){return String(v);}})+'</div>';

  const funnelStages=[['lead','Leads'],['contacted','Contacted'],['active','Active'],['done','Done']];
  const funnelCounts=funnelStages.map(function(s,idx){
    const stagesFromHere=funnelStages.slice(idx).map(function(x){return x[0];});
    return {label:s[1],count:state.clients.filter(function(c){return stagesFromHere.indexOf(c.stage)>-1;}).length};
  });
  const funnelMax=funnelCounts[0].count||1;
  const funnelPanel = '<div class="panel"><div class="panel-title"><div class="panel-title-left"><div class="panel-title-ic">'+iconSvg('i-kanban')+'</div><h2>Pipeline conversion funnel</h2></div></div>'+
    '<div class="funnel">'+funnelCounts.map(function(f,idx){
      const pct=funnelMax?Math.round((f.count/funnelMax)*100):0;
      const ofTotal=funnelMax?Math.round((f.count/funnelMax)*100):0;
      return '<div class="funnel-row"><div class="funnel-label">'+f.label+'</div>'+
        '<div class="funnel-bar-wrap"><div class="funnel-bar" style="width:'+Math.max(pct,f.count?10:0)+'%">'+(f.count?f.count:'')+'</div></div>'+
        '<div class="funnel-pct">'+(idx===0?'100%':ofTotal+'%')+'</div>'+
      '</div>';
    }).join('')+'</div>'+
    '<p style="font-size:11.5px;color:var(--muted);margin:12px 0 0">Share of clients that reached each stage or further</p>'+
  '</div>';

  const typeColors=['var(--navy)','var(--amber)','var(--sage)','var(--rose)','#8a7f78','#6f8fd6'];
  const typeCounts=allClientTypes().map(function(t,idx){
    return {id:t,label:t,value:state.clients.filter(function(c){return c.clientType===t;}).length,color:typeColors[idx%typeColors.length]};
  }).filter(function(t){return t.value>0;});
  const typePanel = '<div class="panel"><div class="panel-title"><h2>Client type distribution</h2></div>'+
    (typeCounts.length ? '<div class="donut-wrap">'+donutChart(typeCounts,{centerLabel:'clients'})+
      '<div class="legend">'+typeCounts.map(function(t){return '<div class="legend-row" style="cursor:default"><i style="background:'+t.color+'"></i><span>'+esc(t.label)+'</span><b>'+t.value+'</b></div>';}).join('')+'</div>'+
    '</div>' : emptyState('No client types set yet.'))+
  '</div>';

  const priorityCounts={High:0,Medium:0,Low:0};
  state.clients.forEach(function(c){ if(priorityCounts[c.priority]!==undefined) priorityCounts[c.priority]++; else if(!c.priority) priorityCounts.Medium++; });
  const priorityPanel = '<div class="panel"><div class="panel-title"><h2>Priority breakdown</h2></div>'+
    '<div class="profile-stat-row">'+
      '<div class="profile-stat"><div class="profile-stat-val" style="color:var(--rose)">'+priorityCounts.High+'</div><div class="profile-stat-label">High</div></div>'+
      '<div class="profile-stat"><div class="profile-stat-val" style="color:#e0a028">'+priorityCounts.Medium+'</div><div class="profile-stat-label">Medium</div></div>'+
      '<div class="profile-stat"><div class="profile-stat-val" style="color:var(--sage)">'+priorityCounts.Low+'</div><div class="profile-stat-label">Low</div></div>'+
    '</div></div>';

  return summaryCards + '<div class="grid-2b">'+statusPanel+activeVsInactivePanel+'</div>' + '<div class="grid-2b">'+newClientsPanel+funnelPanel+'</div>' + '<div class="grid-2b">'+typePanel+priorityPanel+'</div>';
}
